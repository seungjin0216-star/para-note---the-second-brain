<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집</title>
<link rel="manifest" href="/home/manifest.json">
<link rel="icon" href="/home/icon.svg">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집">
<link rel="apple-touch-icon" href="/home/icon-192.png">
<!--
  우리집 대시보드 — 갤럭시탭(가로) = 거실 대시보드 · 폰 = 빠른 입력
  카드: ../../APP.md 의 「우리집」 절 · 날짜 계산은 core.js 하나 (서버 알림도 같은 파일)
  ⚠️ 지우는 코드 없음 (CLAUDE.md ④) — 빼기는 off:true · 다 먹음/버림은 status 로 기록만
-->
<style>
/* 🎨 26-10-02 — 사장님이 주신 재미나이 구성: 어두운 바탕 · 위 메뉴 · 숫자 4칸 · 색 카드
   ⚠️ 구글 폰트·Tailwind 는 안 씁니다 (매장앱에서 글꼴 조각 수십 개로 화면이 멎었던 교훈) */
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#162032;--row:#0f172acc;--line:#334155;--ink:#f1f5f9;--muted:#94a3b8;--soft:#273449;
  --me:#60a5fa;--me-bg:#3b82f626;--her:#f472b6;--her-bg:#ec489926;--we:#34d399;--we-bg:#10b98126;--any:#cbd5e1;--any-bg:#64748b33;
  --bad:#fb7185;--bad-bg:#f43f5e24;--warn:#fbbf24;--warn-bg:#f59e0b24;--off:#64748b;
  --med:#34d399;--cal:#38bdf8;--fridge:#22d3ee;--gym:#fbbf24;--chore:#c084fc;--home:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:dark}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.m-med{--c:var(--med)}.m-cal{--c:var(--cal)}.m-fridge{--c:var(--fridge)}.m-gym{--c:var(--gym)}.m-chore{--c:var(--chore)}.m-home{--c:var(--home)}

/* ── 틀 ── */
.shell{display:flex;flex-direction:column;height:100dvh}
.hdr{display:flex;align-items:center;gap:14px;padding:10px 20px;background:#1e293bcc;border-bottom:1px solid var(--line);flex:none;padding-top:calc(10px + env(safe-area-inset-top))}
.logo{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#2563eb,#4f46e5);color:#fff;font-weight:800;font-size:17px;padding:7px 13px;border-radius:12px;white-space:nowrap}
.tnav{display:flex;gap:3px;background:#0f172a99;border:1px solid var(--line);border-radius:13px;padding:3px}
.tn{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--muted);position:relative}
.tn b{font-weight:400;font-size:16px}
.tn.on{background:#2563eb;color:#fff}
.tn:not(.on):hover{background:var(--soft);color:var(--ink)}
.dotn{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px}
.clk{text-align:right;line-height:1.15}.clk b{display:block;font-size:24px;font-weight:900;letter-spacing:-.5px}.clk small{font-size:12px;color:var(--muted)}
.ib{all:unset;cursor:pointer;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#33415599;border:1px solid #47556988;font-size:18px}
.ib.on{background:#2563eb}
main{flex:1;min-height:0;overflow:auto;padding:16px 20px 24px}
.btm{display:none}
body.phone .tnav,body.phone .clk small{display:none}
body.phone .hdr{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:8px}
body.phone .clk b{font-size:19px}
body.phone .ib{width:38px;height:38px}
body.phone main{padding:12px 12px 18px}
body.phone .btm{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:5px 2px calc(7px + env(safe-area-inset-bottom));flex:none}
.bt{all:unset;cursor:pointer;flex:1;text-align:center;color:var(--muted);font-size:11px;font-weight:600;position:relative;padding:3px 0}
.bt b{display:block;font-weight:400;font-size:21px;line-height:1.3}
.bt.on{color:var(--ink);font-weight:800}
.bt .dotn{top:0;right:calc(50% - 17px)}

/* ── 공통 조각 ── */
.card{background:#1e293bb3;border:1px solid #334155b3;border-radius:18px;padding:16px;display:flex;flex-direction:column;min-height:0;box-shadow:0 4px 14px #0003}
.card h3{font-size:17px;font-weight:800}
.card h3 small{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:6px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:11px;border-bottom:1px solid #33415580;margin-bottom:10px}
.ch .t{display:flex;align-items:center;gap:10px;min-width:0}
.ch p{font-size:12.5px;color:var(--muted);margin-top:1px}
.ch .acts{display:flex;gap:8px;align-items:center}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c,var(--home)) 18%,transparent);flex:none}
.add{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:6px 11px;border-radius:9px;background:color-mix(in srgb,var(--c) 75%,#000);color:#fff;white-space:nowrap}
.lk{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:var(--c);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.list.two{display:grid;grid-template-columns:1fr 1fr}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--row);border:1px solid #33415599;border-radius:13px;min-height:52px}
.row[data-act],.row[data-go]{cursor:pointer}
.row .m{flex:1;min-width:0;cursor:pointer}.row .m b{display:block;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}.row .m small{display:block;font-size:12.5px;color:var(--muted)}
.row.done{background:#064e3b33;border-color:#06594066}.row.done .m b{text-decoration:line-through;color:var(--off)}
.row.late{border-color:#f43f5e88}.row.late .m small,.row.late .m b{color:var(--bad)}
.row.due{border-color:#f59e0b99}
.row.done-g{background:#78350f33;border-color:#92400e66}
.row .go{color:var(--muted)}
.row.ev .m small{color:var(--muted)}.row.ev .m small.today{color:#fb923c;font-weight:700}
.empty{color:var(--off);font-size:13.5px;text-align:center;padding:16px 4px}
.more{font-size:13px;color:var(--muted);padding-top:6px}
.foot{font-size:12.5px;color:var(--muted);margin-top:10px}
.dd{font-weight:800;font-size:12.5px;border-radius:7px;padding:3px 8px;white-space:nowrap}
.dd.r{background:var(--bad-bg);color:var(--bad);border:1px solid #f43f5e55}.dd.y{background:var(--warn-bg);color:var(--warn)}.dd.g{background:#47556955;color:var(--muted)}.dd.n{background:#10b98122;color:var(--we)}
.zt,.pt{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:#33415599;color:#cbd5e1;white-space:nowrap}
.pt{background:#a855f733;color:#d8b4fe}.pt.gy{background:#f59e0b33;color:#fcd34d}
.sl{font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 7px;white-space:nowrap}
.sl-a{background:#f59e0b2e;color:#fcd34d}.sl-b{background:#0ea5e92e;color:#7dd3fc}.sl-c{background:#6366f13a;color:#a5b4fc}
.p{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap}
.p-me{background:var(--me-bg);color:var(--me)}.p-her{background:var(--her-bg);color:var(--her)}.p-we{background:var(--we-bg);color:var(--we)}.p-any{background:var(--any-bg);color:var(--any)}
.c-me{background:var(--me)}.c-her{background:var(--her)}.c-we{background:var(--we)}.c-any{background:var(--any)}
/* 체크 버튼 — 「먹음」「완료」처럼 글자로 */
.ok{all:unset;cursor:pointer;box-sizing:border-box;min-width:62px;min-height:40px;padding:8px 12px;border-radius:11px;font-size:13.5px;font-weight:800;text-align:center;background:#334155;color:#e2e8f0;white-space:nowrap}
.ok.on{background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ok:disabled{opacity:.35;cursor:default}
.ok.me.on{--c:var(--me)}.ok.her.on{--c:var(--her)}
.btn{all:unset;cursor:pointer;box-sizing:border-box;background:color-mix(in srgb,var(--c,#2563eb) 80%,#000);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;font-size:14.5px;text-align:center}
.btn.sec{background:#334155;color:var(--ink);border:1px solid #475569}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.red{background:#e11d48;color:#fff}.red-t{color:var(--bad)!important}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;background:#0f172a;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:14px;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:600;white-space:nowrap}
.seg button.on{background:#2563eb;color:#fff}
.seg.sm button{padding:6px 12px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{all:unset;cursor:pointer;border:1px solid #475569;background:#1e293b;border-radius:99px;padding:7px 12px;font-size:14px}
.chips button.on{background:#2563eb;border-color:#2563eb;color:#fff}
.field{width:100%;background:#0f172a;border:1px solid #475569;border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink)}
.field:focus{outline:2px solid #3b82f6;outline-offset:0}
.lbl{font-size:12.5px;color:#cbd5e1;font-weight:700;margin:14px 0 6px}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid #f59e0b55;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.tag,.once{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px}
.tag.we{background:var(--we-bg);color:var(--we)}.once{background:var(--warn-bg);color:var(--warn)}
/* 화면 머리 */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vh h2{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.vh p{font-size:13.5px;color:var(--muted);margin-top:4px}
.vh .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
body.phone .vh h2{font-size:20px}

/* ── 대시보드 ── */
.dash{display:flex;flex-direction:column;gap:14px;min-height:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:#1e293b99;border:1px solid #334155aa;border-radius:16px;padding:12px 14px}
.stat:hover{border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.stat .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--c) 15%,transparent);flex:none}
.stat small{display:block;font-size:12px;color:var(--muted)}.stat b{font-size:19px;font-weight:800}.stat b.warn{color:var(--warn)}
.bento{display:grid;grid-template-columns:5fr 7fr;gap:14px;flex:1;min-height:0}
.col{display:grid;gap:14px;min-height:0}
.col.l{grid-template-rows:1.15fr 1fr}.col.r{grid-template-rows:auto 1fr}
.col.r>.m-cal .list{max-height:220px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
body.tabL main.fit{overflow:hidden}
body.tabL main.fit .dash{height:100%}
body.phone .stats{grid-template-columns:1fr 1fr;gap:8px}
body.phone .stat{padding:10px}.body.phone .stat .si{width:36px;height:36px}
body.phone .stat b{font-size:16px}
body.phone .bento,body.phone .pair{grid-template-columns:1fr}
body.phone .col{grid-template-rows:none}
body.phone .list.two{grid-template-columns:1fr}

/* ── 약 ── */
.medg{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;align-items:stretch}
.mhd{font-size:17px;font-weight:800;padding:2px 4px}.mhd.me{color:var(--me)}.mhd.her{color:var(--her)}.mhd span{font-size:13px;color:var(--muted);margin-left:4px}
.slab{background:#1e293b99;border:1px solid #334155aa;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.slab small{font-size:12px;color:var(--muted)}
.slab.now{border-color:#3b82f6;box-shadow:inset 0 0 0 1px #3b82f6}
.cell{padding:8px;gap:6px}.cell .row{min-height:48px}
body.phone .medg{grid-template-columns:1fr 1fr;gap:6px}
body.phone .medg .mhd:first-child{display:none}
body.phone .slab{grid-column:1 / 3;flex-direction:row;justify-content:flex-start;padding:6px 10px;border-radius:10px}
body.phone .cell{padding:5px}
body.phone .cell .row{padding:7px 8px;gap:6px;flex-wrap:wrap}
body.phone .cell .row .sl{display:none}
body.phone .cell .ok{min-width:52px;min-height:36px;padding:6px 8px}

/* ── 일정 ── */
.calg{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
body.phone .calg{grid-template-columns:1fr}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-height:320px}
.wday{background:var(--row);border:1px solid #33415599;border-radius:13px;padding:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0}
.wday .dh{font-size:12px;color:var(--muted);font-weight:700}.wday .dh b{font-size:20px;color:var(--ink);margin-right:3px}
.wday.today{border-color:#3b82f6;box-shadow:inset 0 0 0 1px #3b82f6}
.e{border-radius:8px;padding:5px 7px;font-size:12.5px;font-weight:700;line-height:1.3;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.e small{display:block;font-weight:500;font-size:11px;opacity:.8}
.e.me{background:var(--me-bg);color:var(--me)}.e.her{background:var(--her-bg);color:var(--her)}.e.we{background:var(--we-bg);color:var(--we)}.e.any{background:var(--any-bg)}
.e.chore{background:transparent;color:#d8b4fe;border:1px dashed #a855f766;font-weight:600}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .h{font-size:12px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.mc{background:var(--row);border:1px solid #33415566;border-radius:9px;min-height:62px;padding:5px;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.mc.o{opacity:.35}.mc.today{border-color:#3b82f6}.mc.sel{background:#2563eb33}
.mc .bars{display:flex;flex-direction:column;gap:2px}.mc .bar{height:4px;border-radius:2px}
.mc .tx{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 3px}
.mc .more{padding:0;font-size:11px}
body.phone .mc{min-height:44px}
.sub2{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px}
.dbox{background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:4px 9px;text-align:center;line-height:1.1}
.dbox small{display:block;font-size:11px;color:var(--cal)}.dbox b{font-size:17px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* ── 냉장고 ── */
.ftabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}
.ftabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;background:#334155;color:#cbd5e1;font-size:14px;font-weight:600}
.ftabs button.on{background:#0891b2;color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
body.phone .fgrid{grid-template-columns:1fr 1fr;gap:8px}
.fcard{background:#0f172acc;border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:4px}
.fcard.past{opacity:.7}
.fcard .fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.fcard b{font-size:16px}.fcard small{font-size:12px;color:var(--muted)}
.fcard .fb{display:flex;gap:6px;margin-top:auto;padding-top:10px}.fcard .fb .btn{flex:1}

/* ── 운동 ── */
.streaks{display:flex;gap:12px;margin-bottom:14px}
.streaks div{flex:1;border-radius:14px;padding:11px 14px;font-weight:700;font-size:14px;border:1px solid}
.streaks .me{background:var(--me-bg);color:var(--me);border-color:#3b82f655}.streaks .her{background:var(--her-bg);color:var(--her);border-color:#ec489955}
.streaks b{font-size:26px;display:block;line-height:1.15}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
body.phone .wgrid{grid-template-columns:1fr}
.wcard{background:#0f172acc;border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;align-items:center;gap:12px}
.wcard.on{border-color:#f59e0b66}
.wcard .wi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#33415599;flex:none}
.wcard.on .wi{background:#f59e0b2e}
.wcard .m{flex:1;min-width:0;cursor:pointer}.wcard .m b{display:block;font-size:16px}.wcard .m small{font-size:12px;color:var(--muted)}
.wcard .tg{display:flex;gap:5px;margin-bottom:4px}
.wcard .wb{display:flex;flex-direction:column;gap:5px}
.gcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gcal i{font-style:normal;aspect-ratio:1.4;border-radius:7px;background:var(--row);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:600}
.gcal i.h{background:none;aspect-ratio:auto}
.gcal i.a{background:#3b82f666;color:#fff}.gcal i.b{background:#ec489966;color:#fff}
.gcal i.ab{background:linear-gradient(135deg,#3b82f699 50%,#ec489999 50%);color:#fff}
.gcal i.td{outline:2px solid #f1f5f9}

/* ── 집안일 ── */
.cform{flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding:12px}
.cform .field{flex:1 1 220px;padding:10px 12px}.cform .seg{flex:none}
body.phone .cform .seg{flex:1 1 100%}
.cgrid{display:grid;gap:12px;align-items:start}
.cgrid.c4{grid-template-columns:repeat(4,1fr)}.cgrid.c5{grid-template-columns:repeat(5,1fr)}
body.phone .cgrid{grid-template-columns:1fr!important}
.ccol{background:#0f172a99;border:1px solid #334155aa;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ccol h4{font-size:15px;font-weight:800;color:#d8b4fe;display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #33415599}
.ccol .cnt{font-size:11.5px;background:#a855f72e;color:#d8b4fe;padding:2px 8px;border-radius:99px}
.citem{background:#1e293bcc;border:1px solid var(--line);border-radius:12px;padding:10px 11px;display:flex;align-items:center;gap:8px}
.citem .m{flex:1;min-width:0;cursor:pointer}.citem .m b{display:block;font-size:15px}.citem .m small{font-size:12px;color:var(--muted)}
.citem.done .m b{text-decoration:line-through;color:var(--off)}
.citem.late{border-color:#f43f5e88}.citem.late .m b{color:var(--bad)}
.st{color:var(--muted)}.st.bad{color:var(--bad);font-weight:800}.st.now{color:var(--ink);font-weight:800}.st.ok{color:var(--we);font-weight:800}
.citem .ok{min-width:56px}

/* ── 설정 ── */
.setg{display:grid;gap:12px;max-width:680px}

/* ── 아래 판 · 알림 ── */
#ov{position:fixed;inset:0;background:#020617b3;backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
#ov.show{display:flex}
#sheet{background:var(--panel);border:1px solid var(--line);width:min(520px,100%);max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
body.tabL #ov{align-items:center}
body.tabL #sheet{border-radius:20px}
#sheet h2{font-size:20px;font-weight:800;margin-bottom:4px}
#sheet .row2{display:flex;gap:8px;margin-top:18px}
#sheet .row2 .btn{flex:1}
#sheet .card{background:#0f172a;margin-top:8px}
#sheet .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
#sheet .it:first-child{border-top:0}#sheet .it .m{flex:1}#sheet .it .m small{display:block;font-size:12px;color:var(--muted)}
#toast{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:11px 16px;border-radius:13px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px #0008}

#toast.show{opacity:1;pointer-events:auto}
#toast button{all:unset;cursor:pointer;color:#7dd3fc;font-weight:800}

/* ── 탁상 시계 · 밤 화면 ── */
#night{position:fixed;inset:0;background:#000;color:#94a3b8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:70;cursor:pointer;text-align:center;padding:24px}
#night.show{display:flex}
#night .tm{font-size:min(20vw,170px);font-weight:900;letter-spacing:-3px;line-height:1;color:#e2e8f0}
#night.dim .tm{color:#555}#night.dim{color:#444}
#nightInfo{display:flex;gap:16px;background:#0f172acc;border:1px solid #1e293b;border-radius:16px;padding:12px 20px;font-size:15px;margin-top:18px}

/* ── 로그인 ── */
.gate{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.gate h1{font-size:30px;font-weight:800}.gate p{color:var(--muted);font-size:15px;max-width:340px;line-height:1.6}

<body>
<div id="app"><div class="gate"><h1>🏠 우리집</h1><p>불러오는 중…</p></div></div>
<div id="ov"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="night"><div class="tm num" id="nightTm"></div><div id="nightDt" style="font-size:22px"></div><div id="nightInfo"></div><div id="nightNext" style="font-size:16px;margin-top:8px"></div><div style="font-size:12.5px;margin-top:28px;color:#475569">화면을 누르면 대시보드로 돌아갑니다</div></div>

<script type="module">
import * as C from './core.js?v=20261002c';   // ⚠️ core.js 를 고치면 이 v= 도 바꿀 것 (옛 파일이 남아 「medsFor is not a function」 으로 통째로 멈춘 적 있음)

/* ═════════════ 어디서 열렸나 ═════════════
   paranote.netlify.app/home/  → 실제 (구글 로그인 + Firestore 실시간)
   localhost · ?demo           → 미리보기 (이 브라우저에만 저장 · 창 두 개면 서로 바로 맞춰짐) */
const DEMO = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || /[?&]demo/.test(location.search);
const API = '/.netlify/functions/home-api';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ═════════════ 데이터 ═════════════ */
const COLS = ['meds', 'medLogs', 'events', 'food', 'routines', 'workLogs', 'chores'];
const D = { members: {}, meds: {}, medLogs: {}, events: {}, food: {}, routines: {}, workLogs: {}, chores: {}, choreLogs: {}, subs: {} };   // choreLogs·subs 는 쓰기만 (화면은 안 읽음)
let ME = null;            // 이 폰 주인 'me' | 'her'
let USER = null;          // 로그인 정보
let ROLE = ls.get('home-role', null);   // 'tab' = 거실 탭(둘 다 체크) · 'phone'
let cur = ls.get('home-cur', 'home');
let today = C.kst().date;
const 이름 = w => w === 'we' ? '같이' : w === 'any' ? '아무나' : w === 'tab' ? '거실 탭' : (D.members[w] && D.members[w].name) || (w === 'me' ? '나' : '여자친구');
const isTab = () => (ROLE || (tabLayout.matches ? 'tab' : 'phone')) === 'tab';   // 고르지 않았으면 가로 큰 화면 = 거실 탭

const tabLayout = matchMedia('(min-width: 900px) and (min-aspect-ratio: 1/1)');
let DB = null;   // { put(col,id,data), putRoot(data) }

/* ── 미리보기 저장소 ── */
function demoDB() {
  const KEY = 'home-demo-v1';
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('home-demo') : null;
  const load = () => { const s = ls.get(KEY, null); if (s) Object.assign(D, s); };
  load();
  if (!D.members.me) seedDemo();
  ME = ls.get('home-demo-me', 'me');
  bc && (bc.onmessage = () => { load(); render(); });
  const save = () => { ls.set(KEY, D); bc && bc.postMessage(1); };
  return {
    async put(col, id, data) { D[col] = D[col] || {}; D[col][id] = { ...(D[col][id] || {}), ...data, id }; save(); render(); },
    async putRoot(data) { Object.assign(D, { members: { ...D.members, ...(data.members || {}) } }); save(); render(); },
  };
}
function seedDemo() {
  const t = today, A = n => C.addDays(t, n), now = Date.now() - 864e5;
  D.members = { me: { name: '나', email: 'demo-me' }, her: { name: '여자친구', email: 'demo-her' } };
  const put = (col, o) => { const id = o.id || uid(); D[col][id] = { ...o, id }; return id; };
  put('meds', { name: '비타민D', who: 'we', slots: ['아침'], created: now });
  put('meds', { name: '오메가3', who: 'we', slots: ['아침', '저녁'], created: now });
  put('meds', { name: '유산균', who: 'we', slots: ['아침'], created: now });
  put('meds', { name: '혈압약', who: 'me', slots: ['아침'], created: now });
  put('meds', { name: '철분제', who: 'her', slots: ['아침'], created: now });
  put('meds', { name: '마그네슘', who: 'we', slots: ['점심'], created: now });
  put('meds', { name: '피부약', who: 'her', slots: ['저녁'], created: now });
  put('events', { title: '두리 병원', who: 'we', date: t, time: '19:00', repeat: { type: 'none' } });
  put('events', { title: '친구 약속', who: 'her', date: t, time: '20:00', repeat: { type: 'none' } });
  put('events', { title: '헬스 PT', who: 'me', date: A(1), time: '07:30', repeat: { type: 'weekly', days: [C.wdOf(A(1))] } });
  put('events', { title: '장보기', who: 'we', date: A(1), time: '', repeat: { type: 'weekly', days: [C.wdOf(A(1))] } });
  put('events', { title: '엄마 생신', who: 'we', date: A(5), time: '', repeat: { type: 'yearly' } });
  put('food', { name: '두부', place: '냉장', kind: '식자재', added: A(-6), expires: A(-2), status: '있음' });
  put('food', { name: '시금치나물', place: '냉장', kind: '반찬', added: A(-5), expires: t, status: '있음' });
  put('food', { name: '우유', place: '냉장', kind: '식자재', added: A(-7), expires: A(1), status: '있음' });
  put('food', { name: '닭가슴살 ×4', place: '냉동', kind: '식자재', added: A(-20), expires: A(3), status: '있음' });
  put('food', { name: '계란 30구', place: '냉장', kind: '식자재', added: A(-2), expires: A(12), status: '있음' });
  put('food', { name: '식빵', place: '실온', kind: '식자재', added: A(-1), expires: A(2), status: '있음' });
  const r1 = put('routines', { name: '스쿼트 100개', who: 'we', sched: { type: 'daily' } });
  put('routines', { name: '러닝 5km', who: 'me', sched: { type: 'days', days: [1, 3, 5] } });
  put('routines', { name: '요가 30분', who: 'her', sched: { type: 'everyN', n: 2, start: A(-10) } });
  for (let i = 1; i <= 11; i++) { D.workLogs[`${A(-i)}_me_${r1}`] = { date: A(-i), who: 'me', rid: r1, done: true }; if (i < 8) D.workLogs[`${A(-i)}_her_${r1}`] = { date: A(-i), who: 'her', rid: r1, done: true }; }
  put('chores', { name: '분리수거', who: 'me', every: { type: 'weekdays', days: [1, 5] }, lastDone: A(-4), created: A(-30) });
  put('chores', { name: '화장실 청소', who: 'any', every: { type: 'days', n: 7 }, lastDone: A(-9), created: A(-30) });
  put('chores', { name: '이불 빨래', who: 'any', every: { type: 'days', n: 14 }, lastDone: A(-11), created: A(-30) });
  put('chores', { name: '에어컨 필터', who: 'me', every: { type: 'days', n: 14 }, lastDone: A(-19), created: A(-30) });
  put('chores', { name: '두리 목욕', who: 'her', every: { type: 'days', n: 14 }, lastDone: A(-14), created: A(-30) });
  put('chores', { name: '냉장고 정리', who: 'any', every: { type: 'days', n: 30 }, lastDone: A(-20), created: A(-30) });
}

/* ── 실제: Firebase ── */
const FV = '10.12.2', G = m => `https://www.gstatic.com/firebasejs/${FV}/firebase-${m}.js`;
let FB = null;
async function liveDB() {
  const cfg = await (await fetch(API + '?a=config')).json();
  if (!cfg.apiKey) throw new Error('서버 설정(VITE_FIREBASE_*)을 못 받았습니다');
  const [{ initializeApp }, A, F] = await Promise.all([import(G('app')), import(G('auth')), import(G('firestore'))]);
  const app = initializeApp(cfg, 'home');
  const auth = A.getAuth(app);
  let db; try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); } catch (e) { db = F.getFirestore(app); }
  FB = { A, F, auth, db };
  return new Promise(res => A.onAuthStateChanged(auth, u => { USER = u; res(); if (u) startLive(); else gate(); }));
}
let unsubs = [];
function startLive() {
  const { F, db } = FB;
  unsubs.forEach(f => f()); unsubs = [];
  const col = n => F.collection(db, 'homes', 'main', n);
  const fail = e => { if (e.code === 'permission-denied') blocked(); else toast('⚠️ 연결이 끊겼습니다 — 다시 이어지면 저절로 맞춰집니다'); };
  let first = true;
  unsubs.push(F.onSnapshot(F.doc(db, 'homes', 'main'), s => {
    D.members = (s.exists() && s.data().members) || {};
    const email = (USER.email || '').toLowerCase();
    ME = Object.keys(D.members).find(k => (D.members[k].email || '').toLowerCase() === email) || null;
    if (first) { first = false; if (!ME) return whoAmI(); }
    render();
  }, fail));
  const since = { medLogs: C.addDays(today, -2), workLogs: C.addDays(today, -70) };
  COLS.forEach(n => {
    const q = since[n] ? F.query(col(n), F.where('date', '>=', since[n])) : col(n);
    unsubs.push(F.onSnapshot(q, s => { const o = {}; s.forEach(d => { o[d.id] = { id: d.id, ...d.data() }; }); D[n] = o; schedule(); }, fail));
  });
  DB = {
    put: (c, id, data) => F.setDoc(F.doc(db, 'homes', 'main', c, id), data, { merge: true }).catch(e => toast('⚠️ 저장 못 함: ' + e.code)),
    putRoot: data => F.setDoc(F.doc(db, 'homes', 'main'), data, { merge: true }),
  };
}
/* 🔁 옛 형식 → 약 하나씩 (26-10-02 · 한 번만)
   ① 처음 형식  {name, who, times[]}        → 시각마다 시간대로
   ② 세트 형식  {name, who, slot, pills[]}  → 알약마다 하나씩
   같은 (사람, 약 이름) 은 한 약으로 합치고 시간대만 더합니다. id 가 정해져 있어 두 기기가 같이 돌려도 같은 결과
   ⚠️ 옛 것은 지우지 않고 off:true · migrated:true (CLAUDE.md ④) */
let migrated = false;
async function 옛약옮기기() {
  if (migrated || !DB) return;
  const old = Object.values(D.meds).filter(m => !m.off && !(m.slots || []).length && ((m.times || []).length || (m.pills || []).length));
  if (!old.length) return; migrated = true;
  const 시간대 = x => x === '자기 전' ? '저녁' : x;
  const g = {}, add = (who, name, sl, base) => { const id = 'p_' + who + '_' + name.replace(/[\/\s.#$\[\]]/g, '_');
    g[id] = g[id] || { name, who, slots: [], created: base.created || Date.now(), start: base.start || today };
    if (!g[id].slots.includes(sl)) g[id].slots.push(sl); };
  old.forEach(m => {
    if ((m.pills || []).length) m.pills.forEach(p => add(m.who, p, 시간대(m.slot || C.slotOf(m.time || '08:00')), m));
    else m.times.forEach(t => add(m.who, m.name, C.slotOf(t), m));
  });
  for (const [id, v] of Object.entries(g)) { v.slots = C.SLOTS.map(x => x[0]).filter(x => v.slots.includes(x)); await DB.put('meds', id, v); }
  for (const m of old) await DB.put('meds', m.id, { off: true, migrated: true });
  toast(`💊 약을 하나씩 보이게 옮겼습니다 (${Object.keys(g).length}개)`);
}
let rq = 0; function schedule() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }

/* ═════════════ 로그인 화면들 ═════════════ */
function gate() {
  $('#app').innerHTML = `<div class="gate"><h1>🏠 우리집</h1><p>둘만 쓰는 집 대시보드입니다.<br>구글 계정으로 들어와 주세요.</p><button class="btn" id="login">구글로 로그인</button></div>`;
  $('#login').onclick = async () => {
    const { A, auth } = FB, p = new A.GoogleAuthProvider();
    try { await A.signInWithPopup(auth, p); }
    catch (e) { if (/popup/.test(e.code)) A.signInWithRedirect(auth, p); else toast('로그인 실패: ' + e.code); }
  };
}
function blocked() {
  unsubs.forEach(f => f()); unsubs = [];
  $('#app').innerHTML = `<div class="gate"><h1>🚫 들어올 수 없는 계정</h1><p>${esc(USER && USER.email)}<br>우리집 두 사람 계정만 들어올 수 있습니다.</p><button class="btn sec" id="out">다른 계정으로</button></div>`;
  $('#out').onclick = () => FB.A.signOut(FB.auth);
}
function whoAmI() {
  $('#app').innerHTML = `<div class="gate"><h1>👋 처음이네요</h1><p>${esc(USER.email)}<br>이 계정은 누구입니까? (한 번만 물어봅니다)</p>
    <div style="display:flex;gap:10px"><button class="btn" style="background:var(--me)" data-who="me">나</button><button class="btn" style="background:var(--her)" data-who="her">여자친구</button></div></div>`;
  document.querySelectorAll('[data-who]').forEach(b => b.onclick = async () => {
    const w = b.dataset.who, other = D.members[w];
    if (other && other.email && other.email.toLowerCase() !== USER.email.toLowerCase()) return toast(`이미 ${other.email} 로 정해져 있습니다`);
    await DB.putRoot({ members: { [w]: { name: w === 'me' ? '나' : '여자친구', ...(D.members[w] || {}), email: USER.email.toLowerCase() } } });
  });
}

/* ═════════════ 틀 — 위 메뉴 (26-10-02 · 사장님이 주신 재미나이 구성) ═════════════
   탭(가로): 위에 로고 · 메뉴 · 시계 · 탁상 시계 · 설정  /  폰: 위에 로고·시계, 아래 메뉴 */
const SCR = [['home', '🏠', '대시보드'], ['med', '💊', '약'], ['cal', '📅', '일정'], ['fridge', '🧊', '냉장고'], ['gym', '💪', '운동'], ['chore', '🧹', '집안일']];
function layout() {
  const tab = tabLayout.matches;
  document.body.classList.toggle('tabL', tab); document.body.classList.toggle('phone', !tab);
}
tabLayout.addEventListener('change', () => { layout(); lastHtml = ''; render(); });

function badges() {
  const b = {};
  const 안먹음 = w => mySets(w).some(지남);
  b.med = isTab() ? (안먹음('me') || 안먹음('her')) : (ME && 안먹음(ME));
  b.chore = choresSorted().some(c => c.next < today && c.lastDone !== today);
  b.fridge = Object.values(D.food).some(f => f.status === '있음' && f.expires && C.diffDays(f.expires, today) <= 0);
  return b;
}
function shell() {
  if ($('#shell')) return;
  $('#app').innerHTML = `<div class="shell" id="shell"><header class="hdr" id="hdr"></header><main id="main"></main><nav class="btm" id="btm"></nav></div>`;
}
function navHtml(cls) {
  const b = badges();
  return SCR.map(([k, i, l]) => `<button data-go="${k}" class="${cls} m-${k} ${k === cur ? 'on' : ''}"><b>${i}</b><span>${k === 'home' && cls === 'bt' ? '홈' : l}</span>${b[k] ? '<i class="dotn"></i>' : ''}</button>`).join('');
}
function hdrHtml() {
  const k = C.kst();
  return `<div class="logo">🏠 <span>우리집</span></div>
    <nav class="tnav">${navHtml('tn')}</nav>
    <div class="hr">
      <div class="clk"><b class="num">${k.time}</b><small>${긴날짜(today)}</small></div>
      <button class="ib" data-act="ambient" title="탁상 시계">🖥</button>
      <button class="ib ${cur === 'set' ? 'on' : ''}" data-go="set" title="설정">⚙️</button>
    </div>`;
}
let lastHtml = '';
function render() {
  if (!DB) return;
  today = C.kst().date;
  shell(); layout(); 옛약옮기기();
  $('#hdr').innerHTML = hdrHtml();
  $('#btm').innerHTML = navHtml('bt');
  const R = { home: rHome, med: rMed, cal: rCal, fridge: rFridge, gym: rGym, chore: rChore, set: rSet }[cur] || rHome;
  const { body, fit } = R();
  const main = $('#main'); main.classList.toggle('fit', !!fit && document.body.classList.contains('tabL'));
  if (body !== lastHtml) { const y = main.scrollTop; main.innerHTML = body; main.scrollTop = y; lastHtml = body; }
}
function go(k) { cur = k; ls.set('home-cur', k); lastHtml = ''; render(); $('#main').scrollTop = 0; }
/* 화면 머리 — 큰 제목 · 설명 · 오른쪽 버튼 */
const head = (icon, title, sub, acts = '', mod = '') => `<div class="vh"><div><h2><span class="ic ${mod}">${icon}</span>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><div class="acts">${acts}</div></div>`;

/* ═════════════ 공통 계산 ═════════════ */
const taken = key => D.medLogs[key] && D.medLogs[key].taken;
const medList = () => Object.values(D.meds).filter(m => !m.off && (m.slots || []).length);
const mySets = (w, s = today) => C.medsFor(medList(), w, s);   // 이름은 옛것 그대로 · 약 하나씩
const 지남 = x => !taken(x.key) && C.hm2min(x.time) + 60 <= C.kst().min;
const doneMap = () => { const o = {}; Object.entries(D.workLogs).forEach(([k, v]) => { if (v.done) o[k] = 1; }); return o; };
const routines = () => Object.values(D.routines).filter(r => !r.off);
const foods = () => Object.values(D.food).filter(f => f.status === '있음').sort((a, b) => (a.expires || '9999') + (a.added || '') < (b.expires || '9999') + (b.added || '') ? -1 : 1);
const choresSorted = () => Object.values(D.chores).filter(c => !c.off && !(c.once && c.lastDone && c.lastDone < today)).map(c => ({ ...c, next: C.choreNext(c) })).sort((a, b) => a.next < b.next ? -1 : 1);
const whoCls = w => w === 'me' ? 'me' : w === 'her' ? 'her' : w === 'we' ? 'we' : 'any';
const whoChip = w => `<span class="p p-${whoCls(w)}">${w === 'we' ? '👫 같이' : w === 'any' ? '🤝 아무나' : (w === 'me' ? '🙋‍♂️ ' : '🙋‍♀️ ') + 이름(w)}</span>`;
const slotChip = sl => `<span class="sl sl-${{ 아침: 'a', 점심: 'b', 저녁: 'c' }[sl] || 'c'}">${sl}</span>`;
function 긴날짜(s) { const [, m, d] = s.split('-').map(Number); return `${m}월 ${d}일 ${C.DAY[C.wdOf(s)]}요일`; }
function choreSub(c) {
  if (c.once) return `비정기 · ${이름(c.who)}`;
  const n = C.diffDays(c.next, today);
  const when = n < 0 ? `${-n}일 밀림` : n === 0 ? '오늘' : n === 1 ? '내일' : C.label(c.next);
  return `${when} · ${C.everyText(c.every)} · ${이름(c.who)}`;
}
function 주기칸(c) { if (c.once) return '비정기'; const e = c.every || {}; return e.type === 'monthly' ? '매달' : e.type === 'days' && +e.n === 14 ? '격주' : e.type === 'days' && +e.n === 7 ? '매주' : e.type === 'weekdays' ? '매주' : '그 밖'; }

/* 약 「먹음」 버튼 — 탭이면 누구 것이든, 폰이면 내 것만 */
function medBtn(x, who) {
  const on = taken(x.key), can = isTab() || who === ME, log = D.medLogs[x.key];
  return `<button class="ok ${on ? 'on' : ''} m-med" data-act="med" data-key="${x.key}" data-mid="${x.med.id}" data-slot="${x.slot}" data-who="${who}" ${can ? '' : 'disabled'} aria-label="${이름(who)} ${esc(x.med.name)}">${on ? `✓ ${new Date(log.at).toTimeString().slice(0, 5)}` : can ? '먹음' : '–'}</button>`;
}
function medRow(x, w, showWho) {
  const on = taken(x.key), late = 지남(x), due = !on && !late && C.kst().min >= C.hm2min(x.time);
  return `<div class="row ${on ? 'done' : ''} ${late ? 'late' : ''} ${due ? 'due' : ''}">${slotChip(x.slot)}<span class="m" data-act="medEdit" data-id="${x.med.id}"><b>${esc(x.med.name)}</b><small>${[showWho ? (w === 'me' ? '🙋‍♂️ ' : '🙋‍♀️ ') + 이름(w) : '', x.med.who === 'we' ? '같이' : '', late ? '1시간 지남' : due ? '지금 먹을 때' : ''].filter(Boolean).join(' · ')}</small></span>${medBtn(x, w)}</div>`;
}
/* 「따로 한 운동」 — 루틴 말고 갑자기 한 것 · 키 날짜_who_x_id
   ⚠️ 26-10-02 약 화면을 고치다 이 줄을 같이 지워 홈·운동 화면이 멈췄습니다. 지우지 말 것 */
const adhocToday = who => Object.entries(D.workLogs).filter(([k, v]) => v.done && v.adhoc && v.date === today && (!who || v.who === who)).map(([k, v]) => ({ ...v, key: k }));
const adhocRow = x => `<div class="row done-g"><span class="m"><b>🏃 ${esc(x.name)}</b><small>따로 한 운동 · ${이름(x.who)}${x.memo ? ' · ' + esc(x.memo) : ''}</small></span><button class="ok on m-gym" data-act="adhocOff" data-key="${x.key}" ${isTab() || x.who === ME ? '' : 'disabled'}>✓ 함</button></div>`;
function workBtns(r, big) {
  const ws = r.who === 'we' ? ['me', 'her'] : [r.who];
  return ws.map(w => { const k = `${today}_${w}_${r.id}`, on = D.workLogs[k] && D.workLogs[k].done, can = isTab() || w === ME;
    return `<button class="ok ${on ? 'on' : ''} m-gym ${w}" data-act="work" data-rid="${r.id}" data-who="${w}" ${can ? '' : 'disabled'}>${ws.length > 1 ? (w === 'me' ? '🙋‍♂️' : '🙋‍♀️') + ' ' : ''}${on ? (big ? '달성 🎉' : '✓') : (big ? '체크' : '○')}</button>`; }).join('');
}
const empty = t => `<div class="empty">${t}</div>`;

/* ═════════════ 🏠 대시보드 ═════════════ */
function homeFood(max) {
  const list = foods().filter(f => f.expires && C.diffDays(f.expires, today) <= 3);
  return list.slice(0, max).map(f => { const d = C.dday(f.expires, today); return `<div class="row"><span class="zt">${f.place}</span><span class="m"><b>${esc(f.name)}</b></span><span class="dd ${d.cls}">${d.text}</span></div>`; }).join('') || empty('소비기한 임박한 재료가 없습니다 🎉');
}
function rHome() {
  const now = C.kst(), evs = Object.values(D.events);
  const ws = isTab() ? ['me', 'her'] : [ME || 'me'];
  const meds = ws.flatMap(w => mySets(w).map(x => ({ ...x, w }))).sort((a, b) => (taken(a.key) ? 1 : 0) - (taken(b.key) ? 1 : 0) || (a.time < b.time ? -1 : 1));
  const medDone = meds.filter(x => taken(x.key)).length;
  const 오늘일정 = C.eventsOn(evs, today);
  const 임박 = foods().filter(f => f.expires && C.diffDays(f.expires, today) <= 3);
  const 할일 = choresSorted().filter(c => c.lastDone !== today && c.next <= today);
  const 주간 = [0, 1, 2, 3, 4, 5, 6].flatMap(i => { const s = C.addDays(today, i); return C.eventsOn(evs, s).map(e => ({ e, s })); });
  const rs = routines(), dm = doneMap();
  const myR = rs.filter(r => C.routineOn(r, today) && (isTab() || r.who === ME || r.who === 'we'));
  const pw = !isTab() && ME ? (ME === 'me' ? 'her' : 'me') : null;
  const 상대안먹음 = pw ? mySets(pw).filter(지남) : [];
  const stat = (mod, icon, label, val, go, warn) => `<button class="stat m-${mod}" data-go="${go}"><span class="si">${icon}</span><span><small>${label}</small><b class="${warn ? 'warn' : ''}">${val}</b></span></button>`;
  const body = `<div class="dash">
    ${상대안먹음.length ? `<div class="banner"><span>⏰ ${이름(pw)} — 약 ${상대안먹음.length}개 아직 안 먹음</span><button class="btn sm" data-act="poke" data-who="${pw}">🔔 알려주기</button></div>` : ''}
    <div class="stats">
      ${stat('med', '💊', isTab() ? '오늘 복용 약' : '내 약', `${medDone} / ${meds.length} 완료`, 'med')}
      ${stat('cal', '📅', '오늘 일정', `${오늘일정.length}건 있음`, 'cal')}
      ${stat('fridge', '⚠️', '냉장고 임박재료', `${임박.length}개`, 'fridge', 임박.length)}
      ${stat('chore', '🧹', '오늘 할 집안일', `${할일.length}건 남음`, 'chore', 할일.some(c => c.next < today))}
    </div>
    <div class="bento">
      <div class="col l">
        <section class="card m-med"><div class="ch"><div class="t"><span class="ic m-med">💊</span><div><h3>오늘 약 복용 체크</h3><p>시간에 맞춰 잊지 말고 챙겨 드세요</p></div></div><button class="add m-med" data-act="medNew">＋ 등록</button></div>
          <div class="list">${meds.map(x => medRow(x, x.w, isTab())).join('') || empty('등록된 약이 없습니다')}</div></section>
        <section class="card m-chore"><div class="ch"><div class="t"><span class="ic m-chore">🧹</span><div><h3>오늘 할 집안일</h3><p>매주 · 격주 · 매달 잊지 않도록</p></div></div><button class="add m-chore" data-go="chore">전체 →</button></div>
          <div class="list">${할일.map(c => `<div class="row ${c.next < today ? 'late' : ''}" data-go="chore"><span class="pt">${주기칸(c)}</span><span class="m"><b>${esc(c.name)}</b><small>${choreSub(c)}</small></span></div>`).join('') || empty('오늘 할 집안일 없음 👍')}
            ${choresSorted().filter(c => c.lastDone === today).length ? `<div class="more">✓ 오늘 ${choresSorted().filter(c => c.lastDone === today).length}개 함</div>` : ''}</div></section>
      </div>
      <div class="col r">
        <section class="card m-cal"><div class="ch"><div class="t"><span class="ic m-cal">📅</span><div><h3>우리 일정</h3><p>이번 주 주요 일정</p></div></div><div class="acts"><button class="lk m-cal" data-go="cal">전체보기 →</button><button class="add m-cal" data-act="evNew" data-day="${today}">＋ 일정</button></div></div>
          <div class="list two">${주간.slice(0, 8).map(({ e, s }) => `<div class="row ev" data-act="evEdit" data-id="${e.id}" data-day="${s}"><span class="m"><small class="${s === today ? 'today' : ''}">${s === today ? '🔥 오늘' : C.label(s)} ${e.time || '종일'}</small><b>${esc(e.title)}</b></span>${whoChip(e.who)}</div>`).join('') || empty('이번 주 일정 없음')}</div></section>
        <div class="pair">
          <section class="card m-gym"><div class="ch"><div class="t"><span class="ic m-gym">💪</span><div><h3>오늘의 운동</h3><p>🔥 ${이름('me')} ${C.streak(rs, dm, 'me', today)}일 · ${이름('her')} ${C.streak(rs, dm, 'her', today)}일</p></div></div><button class="add m-gym" data-act="adhocNew">＋</button></div>
            <div class="list">${myR.map(r => `<div class="row"><span class="pt ${r.who === 'we' ? 'gy' : ''}">${r.who === 'we' ? '공통' : '개인'}</span><span class="m"><b>${esc(r.name)}</b><small>${이름(r.who)}</small></span>${workBtns(r)}</div>`).join('')}${adhocToday(isTab() ? null : ME).map(adhocRow).join('')}${!myR.length && !adhocToday(isTab() ? null : ME).length ? empty('오늘 운동 없음') : ''}</div></section>
          <section class="card m-fridge"><div class="ch"><div class="t"><span class="ic m-fridge">🧊</span><div><h3>냉장고 임박 재료</h3><p>낭비 없이 맛있게!</p></div></div><button class="lk m-fridge" data-go="fridge">관리 →</button></div>
            <div class="list">${homeFood(6)}</div></section>
        </div>
      </div>
    </div></div>`;
  return { body, fit: true };
}

/* ═════════════ 💊 약 ═════════════
   사장님: 「세트 없애고 각각」 「먹는 사람이 따로라 가시적으로 잘 나눠져야」
   아침·점심·저녁 줄 × 나 | 여자친구 칸 · 폰에서도 두 사람 다 (내 것만 체크) */
function rMed() {
  const nowSlot = C.slotOf(C.kst().time);
  const cnt = w => { const xs = mySets(w); return `${xs.filter(x => taken(x.key)).length}/${xs.length}`; };
  const cell = (w, sl) => mySets(w).filter(x => x.slot === sl).map(x => medRow(x, w)).join('') || empty('없음');
  let body = head('💊', '약 복용 스케줄', `지금은 ${nowSlot} · 체크한 사람만 그 칸에 줄이 그어집니다`, `<button class="btn m-med" data-act="medNew">＋ 약 추가</button>`, 'm-med');
  if (!isTab() && ME) { const pw = ME === 'me' ? 'her' : 'me'; if (mySets(pw).some(지남)) body += `<div class="banner"><span>⏰ ${이름(pw)} 아직 안 먹은 약이 있어요</span><button class="btn sm" data-act="poke" data-who="${pw}">🔔 알려주기</button></div>`; }
  body += `<div class="medg"><div class="mhd"></div>
      <div class="mhd me">🙋‍♂️ ${이름('me')} <span class="num">${cnt('me')}</span></div><div class="mhd her">🙋‍♀️ ${이름('her')} <span class="num">${cnt('her')}</span></div>
      ${C.SLOTS.map(([sl, t]) => `<div class="slab ${sl === nowSlot ? 'now' : ''}">${slotChip(sl)}<small>${t}${sl === nowSlot ? ' · 지금' : ''}</small></div><div class="card cell">${cell('me', sl)}</div><div class="card cell">${cell('her', sl)}</div>`).join('')}</div>`;
  const list = medList().sort((a, b) => a.who < b.who ? -1 : a.name < b.name ? -1 : 1);
  body += `<section class="card" style="margin-top:16px"><div class="ch"><div class="t"><div><h3>약 목록</h3><p>누르면 고치거나 뺄 수 있습니다</p></div></div></div>
      <div class="list">${list.map(m => `<div class="row" data-act="medEdit" data-id="${m.id}">${whoChip(m.who)}<span class="m"><b>${esc(m.name)}</b><small>${(m.slots || []).join(' · ')}${m.memo ? ' · ' + esc(m.memo) : ''}</small></span><span class="go">›</span></div>`).join('') || empty('아직 없음 — 「＋ 약 추가」')}</div></section>
    <p class="foot">🔔 아침 08:00 · 점심 12:30 · 저녁 19:00 에 먹을 사람에게, 1시간이 지나도 체크가 없으면 두 사람 모두와 거실 탭에 알림</p>`;
  return { body };
}

/* ═════════════ 📅 일정 ═════════════ */
let calMode = ls.get('home-calmode', 'week'), calAnchor = null, calSel = null;
function choreDue(s) { return choresSorted().filter(c => c.lastDone !== today && (c.next === s || (s === today && c.next < today))); }
function evChip(e, s) { return `<div class="e ${whoCls(e.who)}" data-act="evEdit" data-id="${e.id}" data-day="${s}">${esc(e.title)}${e.time ? `<small>${e.time}</small>` : ''}</div>`; }
function repText(r) { r = r || {}; return { weekly: '매주 ' + (r.days || []).map(d => C.DAY[d]).join('·'), monthly: '매월', yearly: '매년', everyN: `${r.n}일마다` }[r.type] || '한 번'; }
function rCal() {
  const a = calAnchor || today, evs = Object.values(D.events);
  let cal, sub;
  if (calMode === 'week') {
    const start = C.addDays(a, -C.wdOf(a));
    sub = `${C.label(start)} ~ ${C.label(C.addDays(start, 6))}`;
    cal = `<div class="week">${[0, 1, 2, 3, 4, 5, 6].map(i => { const s = C.addDays(start, i);
      return `<div class="wday ${s === today ? 'today' : ''}" data-act="evNew" data-day="${s}"><div class="dh"><b>${+s.slice(8)}</b>${C.DAY[i]}</div>
        ${C.eventsOn(evs, s).map(e => evChip(e, s)).join('')}${choreDue(s).map(c => `<div class="e chore">🧹 ${esc(c.name)}</div>`).join('')}</div>`; }).join('')}</div>`;
  } else {
    const [y, m] = a.split('-').map(Number), first = `${y}-${String(m).padStart(2, '0')}-01`, start = C.addDays(first, -C.wdOf(first));
    sub = `${y}년 ${m}월`;
    const sel = calSel || today;
    let cells = '';
    for (let i = 0; i < 42; i++) { const s = C.addDays(start, i), es = C.eventsOn(evs, s);
      cells += `<div class="mc ${s.slice(0, 7) !== first.slice(0, 7) ? 'o' : ''} ${s === today ? 'today' : ''} ${s === sel ? 'sel' : ''}" data-act="calSel" data-day="${s}"><b class="num">${+s.slice(8)}</b>
        ${document.body.classList.contains('tabL') ? es.slice(0, 2).map(e => `<span class="tx p-${whoCls(e.who)}">${esc(e.title)}</span>`).join('') + (es.length > 2 ? `<span class="more">+${es.length - 2}</span>` : '') : `<span class="bars">${es.slice(0, 3).map(e => `<i class="bar c-${whoCls(e.who)}"></i>`).join('')}</span>`}</div>`; }
    const es = C.eventsOn(evs, sel);
    cal = `<div class="month">${C.DAY.map(d => `<div class="h">${d}</div>`).join('')}${cells}</div>
      <div class="sub2"><b>${C.label(sel)}</b><button class="add m-cal" data-act="evNew" data-day="${sel}">＋ 이날 일정</button></div>
      <div class="list">${es.map(e => `<div class="row" data-act="evEdit" data-id="${e.id}" data-day="${sel}"><span class="m"><b>${esc(e.title)}</b><small>${e.time || '종일'} · ${repText(e.repeat)}</small></span>${whoChip(e.who)}</div>`).join('') || empty('일정 없음')}</div>`;
  }
  const up = []; for (let i = 0; i < 30 && up.length < 12; i++) { const s = C.addDays(today, i); C.eventsOn(evs, s).forEach(e => up.push({ e, s })); }
  const acts = `<div class="seg sm"><button class="${calMode === 'week' ? 'on' : ''}" data-act="calMode" data-v="week">주</button><button class="${calMode === 'month' ? 'on' : ''}" data-act="calMode" data-v="month">월</button></div><button class="btn sec sm" data-act="calMove" data-d="-1">‹</button><button class="btn sec sm" data-act="calToday">오늘</button><button class="btn sec sm" data-act="calMove" data-d="1">›</button><button class="btn m-cal" data-act="evNew" data-day="${calSel || today}">＋ 일정</button>`;
  const body = head('📅', '우리 일정', sub, acts, 'm-cal') + `<div class="calg">
      <section class="card">${cal}<p class="foot">점선 = 집안일 예정 · 🔔 시간이 있는 일정은 1시간 전에, 일정 있는 날은 아침 8시에 알림</p></section>
      <section class="card"><div class="ch"><div class="t"><div><h3>다가오는 일정</h3><p>앞으로 30일</p></div></div></div>
        <div class="list">${up.map(({ e, s }) => `<div class="row" data-act="evEdit" data-id="${e.id}" data-day="${s}"><span class="dbox"><small>${+s.slice(5, 7)}월</small><b>${+s.slice(8)}</b></span><span class="m"><b>${esc(e.title)}</b><small>${s === today ? '🔥 오늘 · ' : ''}${e.time || '종일'}</small></span>${whoChip(e.who)}</div>`).join('') || empty('없음')}</div>
        <div class="legend">${whoChip('me')}${whoChip('her')}${whoChip('we')}</div></section></div>`;
  return { body };
}

/* ═════════════ 🧊 냉장고 ═════════════ */
let frPlace = '전체';
function foodCard(f) {

    <b>${esc(f.name)}</b><small>${C.label(f.added || today)} 넣음${f.expires ? ` · ${C.label(f.expires)}까지` : ''}${f.qty ? ' · ' + esc(f.qty) : ''}</small>
    <div class="fb"><button class="btn sec sm" data-act="foodOut" data-id="${f.id}" data-v="다먹음">다 먹음</button><button class="btn sec sm red-t" data-act="foodOut" data-id="${f.id}" data-v="버림">버림</button></div></div>`;
}
function rFridge() {
  const all = foods(), P = ['전체', '냉장', '냉동'];
  const list = frPlace === '전체' ? all : all.filter(f => (f.place === '냉동' ? '냉동' : '냉장') === frPlace);
  const n = p => p === '전체' ? all.length : all.filter(f => (f.place === '냉동' ? '냉동' : '냉장') === p).length;
  const body = head('🧊', '냉장고 재고', '소비기한 지나기 전에 먹기 · 냉동은 넣은 지 며칠째인지만', `<button class="btn sec" data-act="foodLog">📜 기록</button><button class="btn m-fridge" data-act="foodNew">＋ 넣기</button>`, 'm-fridge')
    + `<div class="ftabs">${P.map(p => `<button class="${frPlace === p ? 'on' : ''}" data-act="frPlace" data-v="${p}">${{ 전체: '전체 보기', 냉장: '🧊 냉장실', 냉동: '❄️ 냉동실' }[p]} <span class="num">${n(p)}</span></button>`).join('')}</div>
      <div class="fgrid">${list.map(foodCard).join('') || empty('비어 있음')}</div>
      <p class="foot"><span class="dd r">빨강</span> 오늘·내일 <span class="dd y">노랑</span> 2~3일 <span class="dd g">회색</span> 지남</p>`;

/* ═════════════ 💪 운동 ═════════════ */
function rGym() {
  const rs = routines(), dm = doneMap(), todayR = rs.filter(r => C.routineOn(r, today));
  const [y, m] = today.split('-').map(Number), first = today.slice(0, 8) + '01', last = C.lastDay(y, m);
  let cells = C.DAY.map(d => `<i class="h">${d}</i>`).join('') + '<i style="background:none"></i>'.repeat(C.wdOf(first));
  for (let d = 1; d <= last; d++) { const s = today.slice(0, 8) + String(d).padStart(2, '0'), a = C.dayDone(rs, dm, 'me', s), b = C.dayDone(rs, dm, 'her', s);
    cells += `<i class="${a && b ? 'ab' : a ? 'a' : b ? 'b' : ''} ${s === today ? 'td' : ''}">${d}</i>`; }
  const wcard = r => { const ws = r.who === 'we' ? ['me', 'her'] : [r.who], all = ws.every(w => D.workLogs[`${today}_${w}_${r.id}`] && D.workLogs[`${today}_${w}_${r.id}`].done);
    return `<div class="wcard ${all ? 'on' : ''}"><span class="wi">🏋️</span><span class="m" data-act="rtEdit" data-id="${r.id}"><span class="tg">${whoChip(r.who)}<span class="pt ${r.who === 'we' ? 'gy' : ''}">${r.who === 'we' ? '공통' : '개인'}</span></span><b>${esc(r.name)}</b><small>${schedText(r.sched)}</small></span><span class="wb">${workBtns(r, true)}</span></div>`; };
  const body = head('💪', '운동 체크', '공통 운동은 각자 체크 · 갑자기 한 운동은 「따로 한 운동」', `<button class="btn sec" data-act="rtNew">＋ 루틴</button><button class="btn m-gym" data-act="adhocNew">＋ 따로 한 운동</button>`, 'm-gym')
    + `<div class="streaks"><div class="me">🙋‍♂️ ${이름('me')}<b class="num">${C.streak(rs, dm, 'me', today)}일</b>연속</div><div class="her">🙋‍♀️ ${이름('her')}<b class="num">${C.streak(rs, dm, 'her', today)}일</b>연속</div></div>
      <div class="wgrid">${todayR.map(wcard).join('')}${adhocToday().map(x => `<div class="wcard on"><span class="wi">🏃</span><span class="m"><span class="tg">${whoChip(x.who)}<span class="pt">따로</span></span><b>${esc(x.name)}</b><small>${esc(x.memo || '')}</small></span><span class="wb"><button class="ok on m-gym" data-act="adhocOff" data-key="${x.key}" ${isTab() || x.who === ME ? '' : 'disabled'}>달성 🎉</button></span></div>`).join('')}${!todayR.length && !adhocToday().length ? empty('오늘 할 운동이 없습니다') : ''}</div>
      <div class="calg">
        <section class="card"><div class="ch"><div class="t"><div><h3>${m}월 운동한 날</h3><p>파랑 ${이름('me')} · 분홍 ${이름('her')} · 반반 둘 다</p></div></div></div><div class="gcal">${cells}</div></section>
        <section class="card"><div class="ch"><div class="t"><div><h3>루틴</h3><p>누르면 고치거나 뺄 수 있습니다</p></div></div></div>
          <div class="list">${rs.map(r => `<div class="row" data-act="rtEdit" data-id="${r.id}">${whoChip(r.who)}<span class="m"><b>${esc(r.name)}</b><small>${schedText(r.sched)}</small></span><span class="go">›</span></div>`).join('') || empty('루틴이 없습니다')}</div></section></div>`;
  return { body };

function schedText(sc) { sc = sc || {}; return sc.type === 'days' ? (sc.days || []).map(d => C.DAY[d]).join('·') : sc.type === 'everyN' ? `${sc.n}일마다` : '매일'; }

/* ═════════════ 🧹 집안일 ═════════════
   사장님: 「정기적 = 매주 / 격주 / 매달 · 비정기적 = 그냥 추가 · 등록은 상단에」 + 재미나이 구성(주기별 칸) */
const CYCLES = [['7', '매주', { type: 'days', n: 7 }], ['14', '격주', { type: 'days', n: 14 }], ['m', '매달', { type: 'monthly' }]];
let CF = { name: '', type: '정기', cycle: '7', who: 'any' };   // 위 등록 칸 (다시 그려도 안 날아가게)
function rChore() {
  const all = choresSorted(), 함 = c => c.lastDone === today;
  const rank = c => 함(c) ? 2 : c.next < today ? 0 : c.next === today ? 1 : 3;
  const 상태 = c => { if (함(c)) return `<span class="st ok">✓ 오늘 함 · ${이름(c.lastBy || c.who)}</span>`; const n = C.diffDays(c.next, today);
    return n < 0 ? `<span class="st bad">${-n}일 밀림</span>` : n === 0 ? `<span class="st now">오늘</span>` : c.once ? '' : `<span class="st">${n}일 뒤 · ${C.label(c.next)}</span>`; };
  const item = c => `<div class="citem ${함(c) ? 'done' : ''} ${!함(c) && c.next < today ? 'late' : ''}"><span class="m" data-act="chEdit" data-id="${c.id}"><b>${esc(c.name)}</b><small>${이름(c.who)} · ${상태(c)}</small></span><button class="ok ${함(c) ? 'on' : ''} m-chore" data-act="chore" data-id="${c.id}">${함(c) ? '완료됨' : '완료'}</button></div>`;
  const cols = [['매주', '📅 매주'], ['격주', '🔄 격주'], ['매달', '📆 매달'], ['비정기', '📝 비정기']];
  const 그밖 = all.filter(c => 주기칸(c) === '그 밖');
  if (그밖.length) cols.push(['그 밖', '🗂 그 밖']);
  const form = `<section class="card cform">
      <input class="field" id="chName" data-cf="name" value="${esc(CF.name)}" placeholder="할 일 이름 (예: 세탁조 청소)" autocomplete="off">
      <div class="seg"><button class="${CF.type === '정기' ? 'on' : ''}" data-act="cf" data-k="type" data-v="정기">정기</button><button class="${CF.type === '비정기' ? 'on' : ''}" data-act="cf" data-k="type" data-v="비정기">비정기</button></div>
      ${CF.type === '정기' ? `<div class="seg">${CYCLES.map(([k, l]) => `<button class="${CF.cycle === k ? 'on' : ''}" data-act="cf" data-k="cycle" data-v="${k}">${l}</button>`).join('')}</div>` : ''}
      <div class="seg">${[['any', '🤝 아무나'], ['me', 이름('me')], ['her', 이름('her')]].map(([k, l]) => `<button class="${CF.who === k ? 'on' : ''}" data-act="cf" data-k="who" data-v="${k}">${l}</button>`).join('')}</div>
      <button class="btn m-chore" data-act="cfSave">등록</button></section>`;
  const body = head('🧹', '집안일', '체크하면 그날부터 다시 셉니다 · 이름을 누르면 고치기·빼기', '', 'm-chore') + form
    + `<div class="cgrid c${cols.length}">${cols.map(([k, l]) => { const xs = all.filter(c => 주기칸(c) === k).sort((a, b) => rank(a) - rank(b) || (a.next < b.next ? -1 : 1));
      return `<section class="ccol"><h4><span>${l}</span><span class="cnt">${xs.length}건</span></h4>${xs.map(item).join('') || empty('없음')}</section>`; }).join('')}</div>`;
  return { body };
}

  $('#sheet').innerHTML = h;
}
function setF(path, v) { const ks = path.split('.'); let o = F; ks.slice(0, -1).forEach(k => { o[k] = o[k] || {}; o = o[k]; }); o[ks[ks.length - 1]] = v; }
function getF(path) { return path.split('.').reduce((o, k) => o && o[k], F); }
function refreshSaveBtn() { return; const b = $('#sheet [data-act$="Save"]'); if (!b) return;
  const ok = { med: F.name && (F.pills || []).length, ev: F.title && F.date, food: F.name, rt: F.name, ch: F.name, adhoc: F.name, rename: F.name }[sheetKind];
  b.disabled = !ok; }

/* ═════════════ 누르기 ═════════════ */
let tt; function toast(t, undo) { const el = $('#toast'); el.innerHTML = esc(t) + (undo ? ' <button id="undo">되돌리기</button>' : ''); el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), undo ? 5000 : 2200); if (undo) $('#undo').onclick = () => { el.classList.remove('show'); undo(); }; }
const by = w => isTab() ? 'tab' : (ME || w);
async function token() { return DEMO ? '' : FB.auth.currentUser.getIdToken(); }
async function api(body) {
  if (DEMO) { console.log('[미리보기] 알림 안 보냄', body); return { ok: true }; }
  try { const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...body, token: await token() }) }); return await r.json(); }
  catch (e) { return { ok: false, error: e.message }; }
}

document.addEventListener('click', async e => {

        이름이 빈 것으로 보고 버튼이 꺼져 있거나 그냥 return 했습니다
     → 누를 때마다 판의 칸을 직접 다시 읽고, 저장 버튼은 끄지 않고 빠진 게 있으면 말로 알려줌 */

      toast(r.ok ? `🔔 ${이름(w)}에게 보냈습니다` : '⚠️ 못 보냈습니다: ' + (r.error || '')); return; }
    case 'medNew': return openSheet('med', { name: '', who: isTab() ? 'we' : (ME || 'we'), slots: [C.slotOf(C.kst().time)], memo: '' });
    case 'medEdit': return openSheet('med', D.meds[id]);
    case 'medSave': { const name = (F.name || '').trim(); if (!name) return toast('약 이름을 적어 주세요'); if (!(F.slots || []).length) return toast('아침·점심·저녁 중 하나는 골라 주세요');
      const nid = F.id || uid();
      await DB.put('meds', nid, { name, who: F.who, slots: C.SLOTS.map(x => x[0]).filter(x => F.slots.includes(x)), memo: F.memo || '', ...(F.id ? {} : { created: Date.now(), start: today }) });
      closeSheet(); return toast(F.id ? '저장했습니다' : `💊 ${name} 넣었습니다`); }
    case 'medOff': { const mid = F.id, name = F.name; await DB.put('meds', mid, { off: true, offAt: Date.now() }); closeSheet(); return toast(`${name} 뺐습니다`, () => DB.put('meds', mid, { off: false })); }

    /* 일정 */
    case 'calMode': calMode = b.dataset.v; ls.set('home-calmode', calMode); lastHtml = ''; return render();
    case 'calMove': { const d = +b.dataset.d, base = calAnchor || today;

    case 'evSkip': { const ev = D.events[F.id]; await DB.put('events', F.id, { skip: [...(ev.skip || []), F._day] }); closeSheet(); return toast(`${C.label(F._day)} 만 뺐습니다`); }
    case 'evOff': { const ev = D.events[F.id], rep = ev.repeat && ev.repeat.type !== 'none';
      if (rep && F._day && F._day > ev.date) await DB.put('events', F.id, { until: C.addDays(F._day, -1) });

      closeSheet(); return toast('뺐습니다'); }
    /* 냉장고 */
    case 'frPlace': frPlace = b.dataset.v; return render();
    case 'foodNew': return openSheet('food', { name: '', place: '냉장', hasExp: false, days: 3, qty: '' });
    case 'foodPick': { F.name = b.dataset.v; const prev = Object.values(D.food).filter(f => f.name === F.name).sort((x, y) => (y.added || '') < (x.added || '') ? -1 : 1)[0];
      if (prev) { F.place = prev.place === '냉동' ? '냉동' : '냉장'; } return drawSheet(); }
    case 'hasExp': F.hasExp = !F.hasExp; return drawSheet();
    case 'foodSave': { if (!(F.name || '').trim()) return toast('이름을 적어 주세요');
      // 사장님: 「소비기한 있습니다」를 고르면 1~6일 · 안 고르면 기본 7일 · 냉동은 기한 없음
      const exp = F.place === '냉동' ? '' : C.addDays(today, F.hasExp ? Math.min(6, Math.max(1, +F.days || 3)) : 7);
      await DB.put('food', uid(), { name: F.name.trim(), place: F.place, added: today, expires: exp, qty: F.qty || '', status: '있음', by: by(), at: Date.now() });
      closeSheet(); return toast(`🧊 ${F.name.trim()} 넣었습니다${exp ? ` · ${C.label(exp)}까지` : ' · 냉동'}`); }
    case 'foodOut': { const f = D.food[id], v = b.dataset.v === '버림' ? '버림' : '다먹음';
      await DB.put('food', id, { status: v, outAt: Date.now(), outDay: today, outBy: by() });
      return toast(`${f.name} — ${v === '버림' ? '버림' : '다 먹음'}`, () => DB.put('food', id, { status: '있음' })); }
    case 'foodLog': return openSheet('foodLog', {});
    case 'foodBack': await DB.put('food', id, { status: '있음' }); return drawSheet();
    /* 운동 */
    case 'work': { const w = b.dataset.who, rid = b.dataset.rid, k = `${today}_${w}_${rid}`, on = D.workLogs[k] && D.workLogs[k].done;
      const before = C.dayDone(routines(), doneMap(), w, today);
      await DB.put('workLogs', k, { date: today, who: w, rid, done: !on, at: Date.now(), by: by(w) });
      const dm = doneMap(); if (!on) dm[k] = 1; else delete dm[k];
      if (!on && !before && C.dayDone(routines(), dm, w, today)) { toast(`💪 ${이름(w)} 오늘 운동 끝! 🔥 ${C.streak(routines(), dm, w, today)}일 연속`); api({ a: 'workout', who: w, text: '오늘 할 운동을 다 했어요' }); }
      return; }
    case 'adhocNew': return openSheet('adhoc', { who: isTab() ? 'me' : (ME || 'me'), name: '', memo: '' });
    case 'adhocSave': { const w = F.who, name = (F.name || '').trim(); if (!name) return;
      await DB.put('workLogs', `${today}_${w}_x_${uid()}`, { date: today, who: w, adhoc: true, name, memo: F.memo || '', done: true, at: Date.now(), by: by(w) });
      closeSheet(); toast(`🏃 ${이름(w)} · ${name} 기록 · 🔥 ${C.streak(routines(), doneMap(), w, today)}일 연속`);
      api({ a: 'workout', who: w, text: `${name}${F.memo ? ' · ' + F.memo : ''}` }); return; }
    case 'adhocOff': { const k = b.dataset.key, v = D.workLogs[k]; await DB.put('workLogs', k, { done: false }); return toast(`${v.name} 뺐습니다`, () => DB.put('workLogs', k, { done: true })); }
    case 'rtNew': return openSheet('rt', { name: '', who: isTab() ? 'we' : (ME || 'we'), sched: { type: 'daily' } });
    case 'rtEdit': return openSheet('rt', D.routines[id]);
    case 'rtSave': { const nid = F.id || uid(), sc = { ...(F.sched || { type: 'daily' }) };
      if (sc.type === 'everyN') { sc.n = Math.max(1, +sc.n || 2); sc.start = sc.start || today; }
      await DB.put('routines', nid, { name: F.name.trim(), who: F.who, sched: sc }); closeSheet(); return toast('💪 저장했습니다'); }
    case 'rtOff': { const rid = F.id; await DB.put('routines', rid, { off: true }); closeSheet(); return toast('뺐습니다', () => DB.put('routines', rid, { off: false })); }
    /* 집안일 */
    case 'chore': { const c = D.chores[id];
      if (c.lastDone === today) { await DB.put('chores', id, { lastDone: c.prevDone || '', lastBy: c.prevBy || '' }); return toast(`${c.name} — 되돌렸습니다`); }
      const prev = c.lastDone || '';
      await DB.put('chores', id, { lastDone: today, lastBy: ME && !isTab() ? ME : (c.who === 'me' || c.who === 'her' ? c.who : 'tab'), prevDone: prev, prevBy: c.lastBy || '' });
      await DB.put('choreLogs', uid(), { choreId: id, date: today, by: by(), at: Date.now() }).catch(() => {});
      const nx = C.choreNext({ ...c, lastDone: today });

    case 'cf': CF[b.dataset.k] = b.dataset.v; CF.name = ($('#chName') || {}).value || CF.name; lastHtml = ''; return render();
    case 'cfSave': { CF.name = ($('#chName').value || '').trim(); if (!CF.name) return toast('할 일 이름을 적어 주세요');

      await DB.put('chores', uid(), { name: CF.name, who: CF.who, ...(once ? { once: true } : { every: cy[2] }), start: today, created: today });
      const n = CF.name; CF.name = ''; lastHtml = ''; render(); return toast(`🧹 「${n}」 등록 — ${once ? '비정기' : cy[1]}`); }
    case 'chQuick': { const v = ($('#choreQuick').value || '').trim(); if (!v) return;

    case 'chSave': { const name = (F.name || '').trim(); if (!name) return toast('이름을 적어 주세요');

    case 'role': ROLE = b.dataset.v; ls.set('home-role', ROLE); wake(); lastHtml = ''; return render();

document.addEventListener('input', e => {
  if (e.target.dataset.cf) { CF[e.target.dataset.cf] = e.target.value; return; }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.id === 'chName') { e.preventDefault(); $('[data-act="cfSave"]').click(); return; }
  });

/* ═════════════ 🔔 알림 받기 ═════════════ */
const pushOn = () => ls.get('home-push', false);
async function pushSubscribe() {
  if (DEMO) return toast('미리보기에서는 알림을 안 켭니다');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('⚠️ 알림이 막혀 있습니다. 브라우저 설정에서 허용해 주세요');
    const reg = await navigator.serviceWorker.register('/home/sw.js', { scope: '/home/' });
    await navigator.serviceWorker.ready;
    const { key } = await (await fetch(API + '?a=vapid')).json();
    const raw = atob(key.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(key.length / 4) * 4, '='));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0)) });
    const s = JSON.stringify(sub), h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sub.endpoint)))].slice(0, 12).map(x => x.toString(16).padStart(2, '0')).join('');
    await DB.put('subs', h, { who: isTab() ? 'tab' : ME, sub: s, ua: navigator.userAgent.slice(0, 120), at: Date.now(), off: false });
    ls.set('home-push', true); render(); toast('🔔 알림을 켰습니다');
  } catch (e) { toast('⚠️ 알림 켜기 실패: ' + e.message); }
}

/* ═════════════ 🖥 거실 탭: 화면 켜짐 · 밤 화면 ═════════════ */
async function wake() {
  if (!isTab() || !('wakeLock' in navigator)) { wakeOn = false; return; }
  try { if (!wakeLock || wakeLock.released) { wakeLock = await navigator.wakeLock.request('screen'); wakeOn = true; wakeLock.addEventListener('release', () => { wakeOn = false; }); } } catch (e) { wakeOn = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); render(); } });
let nightSnooze = 0, ambientOn = false;
/* 🖥 탁상 시계 — 위의 🖥 버튼으로 켜고, 거실 탭은 밤 0~7시에 저절로 (어둡게) */
function night() {
  const k = C.kst(), auto = isTab() && k.min < 7 * 60 && Date.now() - nightSnooze > 10 * 60e3, on = ambientOn || auto;
  $('#night').classList.toggle('show', on); $('#night').classList.toggle('dim', !ambientOn && auto);
  if (!on) return;
  $('#nightTm').textContent = k.time; $('#nightDt').textContent = 긴날짜(k.date);
  const ws = isTab() ? ['me', 'her'] : [ME || 'me'], left = ws.flatMap(w => mySets(w)).filter(x => !taken(x.key)).length, evs = C.eventsOn(Object.values(D.events), k.date);
  $('#nightInfo').innerHTML = `<span style="color:var(--med)">💊 약 ${left}개 남음</span><span style="color:#475569">|</span><span style="color:var(--cal)">📅 오늘 일정 ${evs.length}건</span>`;
  const ev = evs.find(e => !e.time || e.time >= k.time);
  $('#nightNext').textContent = ev ? `다음 · ${ev.time || '종일'} ${ev.title}` : '';
}

/* ═════════════ 시작 ═════════════ */
let lastMin = '';
setInterval(() => { const k = C.kst(); if (k.time !== lastMin) { lastMin = k.time; render(); night(); } }, 5000);
(async () => {
  try {
    if (DEMO) { DB = demoDB(); layout(); render(); }
    else await liveDB();
    wake(); night();
    if (!DEMO && 'serviceWorker' in navigator && pushOn()) navigator.serviceWorker.register('/home/sw.js', { scope: '/home/' }).catch(() => {});
  } catch (e) {
    $('#app').innerHTML = `<div class="gate"><h1>⚠️ 못 열었습니다</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">다시</button></div>`;
  }
})();
