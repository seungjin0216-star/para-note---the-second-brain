<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집</title>
<link rel="manifest" href="/home/manifest.json">
<link rel="icon" href="/home/icon.svg">
<meta name="theme-color" content="#22262A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집">
<link rel="apple-touch-icon" href="/home/icon-192.png">
<!--
  우리집 대시보드 — 갤럭시탭(가로) = 거실 대시보드 · 폰 = 빠른 입력
  카드: ../../APP.md 의 「우리집」 절 · 날짜 계산은 core.js 하나 (서버 알림도 같은 파일)
  ⚠️ 지우는 코드 없음 (CLAUDE.md ④) — 빼기는 off:true · 다 먹음/버림은 status 로 기록만
-->
<style>
:root{--paper:#F4F3EF;--surface:#fff;--ink:#22262A;--muted:#6B7177;--line:#E4E2DC;--soft:#efeee9;
  --me:#2F6FB3;--me-bg:#e3eef9;--her:#D2557A;--her-bg:#fbe5ec;--we:#3E8E66;--we-bg:#e2f2ea;--any:#8A7D6B;--any-bg:#efebe5;
  --bad:#D23B3B;--bad-bg:#fde2e2;--warn-bg:#fdf3d0;--warn:#8a6500;--off:#9AA0A6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#15181b;--surface:#1f2327;--ink:#ECEDEE;--muted:#9aa1a8;--line:#30353a;--soft:#2a2f34;
  --me-bg:#1d2f45;--her-bg:#45202d;--we-bg:#1c3a2b;--any-bg:#38322a;--bad-bg:#4a1f1f;--warn-bg:#47391a;--warn:#f0c75e}}
:root[data-theme="dark"]{--paper:#15181b;--surface:#1f2327;--ink:#ECEDEE;--muted:#9aa1a8;--line:#30353a;--soft:#2a2f34;
  --me-bg:#1d2f45;--her-bg:#45202d;--we-bg:#1c3a2b;--any-bg:#38322a;--bad-bg:#4a1f1f;--warn-bg:#47391a;--warn:#f0c75e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--paper);color:var(--ink);word-break:keep-all;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ── 틀: 탭(가로) = 왼쪽 메뉴 · 폰 = 아래 메뉴 ── */
.shell{display:flex;height:100dvh}
.rail{width:92px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0 calc(12px + env(safe-area-inset-bottom));gap:4px;flex:none}
.rail button,.btm button{all:unset;cursor:pointer;text-align:center;color:var(--muted);font-weight:600;position:relative}
.rail button{width:74px;padding:9px 0;border-radius:16px;font-size:12.5px}
.rail button b,.btm button b{display:block;font-weight:400;line-height:1.25}
.rail button b{font-size:26px}
.rail button.on{background:var(--soft);color:var(--ink)}
.rail .sp{flex:1}
.dotn{position:absolute;top:6px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.page{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 6px}
.top h1{font-size:26px;font-weight:800}.top .s{color:var(--muted);font-size:14px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{flex:1;min-height:0;overflow:auto;padding:10px 20px 20px}
.btm{display:none}
body.phone .rail{display:none}
body.phone .btm{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 2px calc(8px + env(safe-area-inset-bottom))}
body.phone .btm button{flex:1;font-size:11px;padding:2px 0}
body.phone .btm button b{font-size:21px}
body.phone .btm button.on{color:var(--ink);font-weight:800}
body.phone .btm .dotn{top:0;right:calc(50% - 16px)}
body.phone .top{padding:calc(12px + env(safe-area-inset-top)) 16px 4px}
body.phone .top h1{font-size:22px}
body.phone main{padding:8px 12px 16px}

/* ── 공통 조각 ── */
.card{background:var(--surface);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card h3{font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.card h3 small{font-size:13px;color:var(--muted);font-weight:600}
.card h3 .go{all:unset;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:17px;min-height:52px}
.it:first-child,.card h3+.it{border-top:0}
.it .m{flex:1;min-width:0}.it .m small{display:block;font-size:13px;color:var(--muted)}
.it .m b{font-weight:600}
.more{font-size:13.5px;color:var(--muted);padding-top:6px;margin-top:auto}
.empty{color:var(--muted);font-size:15px;padding:14px 0}
.dd{font-weight:800;font-size:14px;border-radius:9px;padding:3px 9px;white-space:nowrap}
.dd.r{background:var(--bad-bg);color:var(--bad)}.dd.y{background:var(--warn-bg);color:var(--warn)}.dd.g{background:var(--soft);color:var(--off)}.dd.n{color:var(--muted)}
.late,.late small{color:var(--bad)!important}
.it.done b,.ch.done b{text-decoration:line-through;color:var(--muted)}
.ch.done{opacity:.75}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.c-me{background:var(--me)}.c-her{background:var(--her)}.c-we{background:var(--we)}.c-any{background:var(--any)}
.p{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.p-me{background:var(--me-bg);color:var(--me)}.p-her{background:var(--her-bg);color:var(--her)}.p-we{background:var(--we-bg);color:var(--we)}.p-any{background:var(--any-bg);color:var(--any)}
.chk{all:unset;cursor:pointer;width:42px;height:42px;border-radius:12px;border:2.5px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;flex:none;box-sizing:border-box}
.chk.me{border-color:color-mix(in srgb,var(--me) 40%,var(--line))}.chk.her{border-color:color-mix(in srgb,var(--her) 40%,var(--line))}.chk.any{border-color:color-mix(in srgb,var(--we) 40%,var(--line))}
.chk.me.on{background:var(--me);border-color:var(--me)}.chk.her.on{background:var(--her);border-color:var(--her)}.chk.any.on,.chk.we.on{background:var(--we);border-color:var(--we)}
.chk:disabled{opacity:.35;cursor:default}
.btn{all:unset;cursor:pointer;background:var(--ink);color:var(--paper);border-radius:13px;padding:10px 16px;font-weight:800;font-size:15px;text-align:center;box-sizing:border-box}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn.red{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:14px;padding:8px 6px;border-radius:10px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{all:unset;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 6px}
.cols{display:grid;gap:14px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:11px 14px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* ── 홈 (탭): 스크롤 없이 한 화면 ── */
.home{display:grid;grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:100%}
.home .clock{grid-row:1 / 3;background:#22262A;color:#fff;justify-content:space-between}
.clock .tm{font-size:92px;font-weight:800;letter-spacing:-3px;line-height:1}
.clock .dt{font-size:22px;font-weight:700;opacity:.85;margin-top:6px}
.tl{margin-top:18px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.tl .ev{display:flex;gap:12px;align-items:flex-start}
.tl .ev .h{width:58px;font-size:17px;font-weight:700;opacity:.7;flex:none}
.tl .ev .b{flex:1;border-left:4px solid;padding:1px 0 1px 11px;font-size:18px;font-weight:700}
.tl .ev .b small{display:block;font-size:13px;font-weight:500;opacity:.7}
.tl .ev.past{opacity:.4}
.tl .day{font-size:13px;opacity:.6;font-weight:700;margin-top:4px}
.clock .foot{font-size:12.5px;opacity:.55;display:flex;justify-content:space-between}
body.tabL main.fit{overflow:hidden}
.twin{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;min-height:0}
.twin .who{font-size:13px;font-weight:800;margin:2px 0}
/* 홈 (폰) */
.stack{display:flex;flex-direction:column;gap:12px}

/* ── 약 ── */
.medcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.medcol .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px;font-size:20px;font-weight:800}
.medcol.me .hd{color:var(--me)}.medcol.her .hd{color:var(--her)}
.slot{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px;border:2px solid transparent}
.slot .t{font-size:20px;font-weight:800;width:62px}
.slot .m{flex:1;min-width:0;font-size:17px;font-weight:600}.slot .m small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.slot.due{border-color:var(--warn)}.slot.late{border-color:var(--bad)}
.slot.done{opacity:.6}
.medcol.me .slot.done{background:var(--me-bg)}.medcol.her .slot.done{background:var(--her-bg)}
.medlist .it{cursor:pointer}

.prog{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:13px;padding:7px 12px;font-weight:700;font-size:14px}
.prog i{font-style:normal;display:inline-flex;gap:3px}.prog i span{width:22px;height:8px;border-radius:4px;background:var(--line)}
.prog.me i span.y{background:var(--me)}.prog.her i span.y{background:var(--her)}
body.phone .prog{display:none}
.mgrid{display:grid;grid-template-columns:100px 1fr 1fr;gap:10px}
.mh{font-size:19px;font-weight:800;padding:2px 4px}.mh.me{color:var(--me)}.mh.her{color:var(--her)}
.slotlab{background:var(--surface);border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800;font-size:18px;gap:2px;min-height:70px}
.slotlab small{font-size:12.5px;color:var(--muted);font-weight:600}
.slotlab.now{background:var(--ink);color:var(--paper)}.slotlab.now small{color:inherit;opacity:.7}
.cell{display:flex;flex-direction:column;gap:8px}
.set{background:var(--surface);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;border:2.5px solid transparent}
.set .m{flex:1;min-width:0;cursor:pointer}.set .m b{font-size:16.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.set .m small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px}
.tag.we{background:var(--we-bg);color:var(--we)}.tag.me{background:var(--me-bg);color:var(--me)}.tag.her{background:var(--her-bg);color:var(--her)}
.set.done .m b,.set.done .m small{text-decoration:line-through;color:var(--off)}
.set.done.me{background:var(--me-bg)}.set.done.her{background:var(--her-bg)}
.set.late{border-color:var(--bad)}.set.late .m small{color:var(--bad)}.set.due{border-color:#e0a100}
.slothd{font-size:13px;font-weight:800;color:var(--muted);margin:10px 2px 6px}.slothd.now{color:var(--ink)}
.slothd+.set,.set+.set{margin-top:6px}
.pillrow{background:var(--surface);border-radius:13px;padding:7px 8px 7px 12px;display:flex;align-items:center;gap:8px;border:2px solid transparent;min-height:52px}
.pillrow .m{flex:1;min-width:0;cursor:pointer}.pillrow .m b{font-size:16px;font-weight:600;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pillrow .m small{display:block;font-size:12px;color:var(--muted)}
.pillrow.done .m b{text-decoration:line-through;color:var(--off)}.pillrow.done.me{background:var(--me-bg)}.pillrow.done.her{background:var(--her-bg)}
.pillrow.late{border-color:var(--bad)}.pillrow.late small{color:var(--bad)}.pillrow.due{border-color:#e0a100}
.cell .pillrow+.pillrow{margin-top:6px}
.card .pillrow{background:var(--soft)}.card .pillrow+.pillrow{margin-top:6px}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mgrid2 .mh{font-size:16px}
.slothd2{grid-column:1 / 3;font-size:13px;font-weight:800;color:var(--muted);margin-top:6px}.slothd2.now{color:var(--ink)}
body.phone .pillrow .chk{width:38px;height:38px;font-size:18px}
body.phone .pillrow .m b{font-size:14.5px}
/* ── 일정 ── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;min-height:360px}
.wday{background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.wday .dh{font-size:13px;color:var(--muted);font-weight:700}.wday .dh b{font-size:22px;color:var(--ink);margin-right:3px}
.wday.today{outline:3px solid var(--ink)}
.e{border-radius:9px;padding:6px 8px;font-size:13.5px;font-weight:700;line-height:1.3;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.e small{display:block;font-weight:500;font-size:12px;opacity:.8}
.e.me{background:var(--me-bg);color:var(--me)}.e.her{background:var(--her-bg);color:var(--her)}.e.we{background:var(--we-bg);color:var(--we)}
.e.chore{background:transparent;color:var(--any);border:1.5px dashed var(--line);font-weight:600}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .h{font-size:12px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.mc{background:var(--surface);border-radius:10px;min-height:64px;padding:5px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.mc.o{opacity:.35}.mc.today{outline:2.5px solid var(--ink)}.mc.sel{background:var(--soft)}
.mc .bars{display:flex;flex-direction:column;gap:2px}
.mc .bar{height:5px;border-radius:3px}
.mc .tx{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 3px}
body.phone .mc{min-height:46px}

/* ── 냉장고 ── */
.fr{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:14px;align-items:start}

/* ── 운동 ── */
.streaks{display:flex;gap:10px;margin:2px 0 8px}
.streaks div{flex:1;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}
.streaks b{font-size:28px;display:block;line-height:1.1}
.gcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.gcal i{font-style:normal;aspect-ratio:1.4;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.gcal i.h{background:none;aspect-ratio:auto}
.gcal i.a{background:color-mix(in srgb,var(--me) 45%,transparent);color:#fff}.gcal i.b{background:color-mix(in srgb,var(--her) 45%,transparent);color:#fff}
.gcal i.ab{background:linear-gradient(135deg,color-mix(in srgb,var(--me) 55%,transparent) 50%,color-mix(in srgb,var(--her) 55%,transparent) 50%);color:#fff}
.gcal i.td{outline:2.5px solid var(--ink)}

/* ── 집안일 ── */
.cform{flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;padding:12px}
.cform .field{flex:1 1 220px;padding:10px 12px}.cform .seg{flex:none}
.ctable{padding:6px 14px}
.tr{display:grid;grid-template-columns:1.6fr .8fr 1.2fr .8fr 52px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tr.th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:700;padding:6px 0}
.tr .nm{cursor:pointer;min-width:0}.tr .nm b{font-size:16px;display:block}.tr .nm small{font-size:12px;color:var(--muted)}
.tr.done .nm b{text-decoration:line-through;color:var(--off)}
.tr.late .nm b{color:var(--bad)}
.tr .last{font-size:13px;color:var(--muted)}
.st{font-size:13.5px;color:var(--muted)}.st.bad{color:var(--bad);font-weight:800}.st.now{color:var(--ink);font-weight:800}.st.ok{color:var(--we);font-weight:800}
.reg{font-size:12.5px;font-weight:800;background:var(--we-bg);color:var(--we);border-radius:6px;padding:2px 7px}
body.phone .tr{grid-template-columns:1fr auto 44px;gap:8px}
body.phone .tr > span:nth-child(2),body.phone .tr > span:nth-child(4){display:none}
body.phone .tr.th{display:none}
body.phone .cform .seg{flex:1 1 100%}
.cgrid{display:grid;grid-template-columns:1.2fr .9fr 1.1fr;gap:14px;align-items:start}
.gauge{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:5px}.gauge i{display:block;height:100%;border-radius:4px}
.once{font-size:11px;font-weight:800;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 6px}
.quick{display:flex;gap:8px;margin-top:12px}.quick .field{flex:1;padding:9px 11px;font-size:15px}
.chores{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.ccol{background:var(--soft);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ccol.bad{background:var(--bad-bg)}
.ccol h4{font-size:15px;font-weight:800;display:flex;justify-content:space-between;padding:0 2px}
.ch{background:var(--surface);border-radius:14px;padding:11px 12px;display:flex;gap:10px;align-items:center}
.ch .m{flex:1;min-width:0;cursor:pointer}.ch .m b{font-size:16px;display:block}.ch .m small{font-size:12.5px;color:var(--muted)}
body.phone .chores{grid-template-columns:1fr}
body.phone .fr{grid-template-columns:1fr}
body.phone .medcols{gap:8px}
body.phone .slot{padding:10px;gap:8px}
body.phone .slot .t{width:auto;font-size:15px}
body.phone .slot .m{font-size:15px}

/* ── 아래 판 · 알림 ── */
#ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:50}
#ov.show{display:flex}
#sheet{background:var(--paper);width:min(560px,100%);max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
body.tabL #ov{align-items:center}
body.tabL #sheet{border-radius:22px}
#sheet h2{font-size:20px;font-weight:800;margin-bottom:4px}
#sheet .row2{display:flex;gap:8px;margin-top:18px}
#sheet .row2 .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;display:flex;gap:12px;align-items:center}
#toast.show{opacity:1;pointer-events:auto}
#toast button{all:unset;cursor:pointer;color:#7fc4ff;font-weight:800}

/* ── 밤 화면 ── */
#night{position:fixed;inset:0;background:#000;color:#5a5a5a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:70;cursor:pointer}
#night.show{display:flex}

<body>
<div id="app"><div class="gate"><h1>🏠 우리집</h1><p>불러오는 중…</p></div></div>
<div id="ov"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="night"><div class="tm num" id="nightTm"></div><div id="nightDt" style="font-size:22px"></div><div id="nightNext" style="font-size:16px;margin-top:16px"></div><div style="font-size:13px;margin-top:28px;color:#333">누르면 평소 화면 · 아침 7시에 저절로</div></div>

<script type="module">
import * as C from './core.js?v=20261002c';   // ⚠️ core.js 를 고치면 이 v= 도 바꿀 것 (옛 파일이 남아 「medsFor is not a function」 으로 통째로 멈춘 적 있음)

/* ═════════════ 어디서 열렸나 ═════════════
   paranote.netlify.app/home/  → 실제 (구글 로그인 + Firestore 실시간)
   localhost · ?demo           → 미리보기 (이 브라우저에만 저장 · 창 두 개면 서로 바로 맞춰짐) */
const DEMO = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || /[?&]demo/.test(location.search);
const API = '/.netlify/functions/home-api';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ═════════════ 데이터 ═════════════ */
const COLS = ['meds', 'medLogs', 'events', 'food', 'routines', 'workLogs', 'chores'];
const D = { members: {}, meds: {}, medLogs: {}, events: {}, food: {}, routines: {}, workLogs: {}, chores: {}, choreLogs: {}, subs: {} };   // choreLogs·subs 는 쓰기만 (화면은 안 읽음)
let ME = null;            // 이 폰 주인 'me' | 'her'
let USER = null;          // 로그인 정보
let ROLE = ls.get('home-role', null);   // 'tab' = 거실 탭(둘 다 체크) · 'phone'
let cur = ls.get('home-cur', 'home');
let today = C.kst().date;
const 이름 = w => w === 'we' ? '같이' : w === 'any' ? '아무나' : w === 'tab' ? '거실 탭' : (D.members[w] && D.members[w].name) || (w === 'me' ? '나' : '여자친구');
const isTab = () => (ROLE || (tabLayout.matches ? 'tab' : 'phone')) === 'tab';   // 고르지 않았으면 가로 큰 화면 = 거실 탭

const tabLayout = matchMedia('(min-width: 900px) and (min-aspect-ratio: 1/1)');
let DB = null;   // { put(col,id,data), putRoot(data) }

/* ── 미리보기 저장소 ── */
function demoDB() {
  const KEY = 'home-demo-v1';
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('home-demo') : null;
  const load = () => { const s = ls.get(KEY, null); if (s) Object.assign(D, s); };
  load();
  if (!D.members.me) seedDemo();
  ME = ls.get('home-demo-me', 'me');
  bc && (bc.onmessage = () => { load(); render(); });
  const save = () => { ls.set(KEY, D); bc && bc.postMessage(1); };
  return {
    async put(col, id, data) { D[col] = D[col] || {}; D[col][id] = { ...(D[col][id] || {}), ...data, id }; save(); render(); },
    async putRoot(data) { Object.assign(D, { members: { ...D.members, ...(data.members || {}) } }); save(); render(); },
  };
}
function seedDemo() {
  const t = today, A = n => C.addDays(t, n), now = Date.now() - 864e5;
  D.members = { me: { name: '나', email: 'demo-me' }, her: { name: '여자친구', email: 'demo-her' } };
  const put = (col, o) => { const id = o.id || uid(); D[col][id] = { ...o, id }; return id; };
  put('meds', { name: '비타민D', who: 'we', slots: ['아침'], created: now });
  put('meds', { name: '오메가3', who: 'we', slots: ['아침', '저녁'], created: now });
  put('meds', { name: '유산균', who: 'we', slots: ['아침'], created: now });
  put('meds', { name: '혈압약', who: 'me', slots: ['아침'], created: now });
  put('meds', { name: '철분제', who: 'her', slots: ['아침'], created: now });
  put('meds', { name: '마그네슘', who: 'we', slots: ['점심'], created: now });
  put('meds', { name: '피부약', who: 'her', slots: ['저녁'], created: now });
  put('events', { title: '두리 병원', who: 'we', date: t, time: '19:00', repeat: { type: 'none' } });
  put('events', { title: '친구 약속', who: 'her', date: t, time: '20:00', repeat: { type: 'none' } });
  put('events', { title: '헬스 PT', who: 'me', date: A(1), time: '07:30', repeat: { type: 'weekly', days: [C.wdOf(A(1))] } });
  put('events', { title: '장보기', who: 'we', date: A(1), time: '', repeat: { type: 'weekly', days: [C.wdOf(A(1))] } });
  put('events', { title: '엄마 생신', who: 'we', date: A(5), time: '', repeat: { type: 'yearly' } });
  put('food', { name: '두부', place: '냉장', kind: '식자재', added: A(-6), expires: A(-2), status: '있음' });
  put('food', { name: '시금치나물', place: '냉장', kind: '반찬', added: A(-5), expires: t, status: '있음' });
  put('food', { name: '우유', place: '냉장', kind: '식자재', added: A(-7), expires: A(1), status: '있음' });
  put('food', { name: '닭가슴살 ×4', place: '냉동', kind: '식자재', added: A(-20), expires: A(3), status: '있음' });
  put('food', { name: '계란 30구', place: '냉장', kind: '식자재', added: A(-2), expires: A(12), status: '있음' });
  put('food', { name: '식빵', place: '실온', kind: '식자재', added: A(-1), expires: A(2), status: '있음' });
  const r1 = put('routines', { name: '스쿼트 100개', who: 'we', sched: { type: 'daily' } });
  put('routines', { name: '러닝 5km', who: 'me', sched: { type: 'days', days: [1, 3, 5] } });
  put('routines', { name: '요가 30분', who: 'her', sched: { type: 'everyN', n: 2, start: A(-10) } });
  for (let i = 1; i <= 11; i++) { D.workLogs[`${A(-i)}_me_${r1}`] = { date: A(-i), who: 'me', rid: r1, done: true }; if (i < 8) D.workLogs[`${A(-i)}_her_${r1}`] = { date: A(-i), who: 'her', rid: r1, done: true }; }
  put('chores', { name: '분리수거', who: 'me', every: { type: 'weekdays', days: [1, 5] }, lastDone: A(-4), created: A(-30) });
  put('chores', { name: '화장실 청소', who: 'any', every: { type: 'days', n: 7 }, lastDone: A(-9), created: A(-30) });
  put('chores', { name: '이불 빨래', who: 'any', every: { type: 'days', n: 14 }, lastDone: A(-11), created: A(-30) });
  put('chores', { name: '에어컨 필터', who: 'me', every: { type: 'days', n: 14 }, lastDone: A(-19), created: A(-30) });
  put('chores', { name: '두리 목욕', who: 'her', every: { type: 'days', n: 14 }, lastDone: A(-14), created: A(-30) });
  put('chores', { name: '냉장고 정리', who: 'any', every: { type: 'days', n: 30 }, lastDone: A(-20), created: A(-30) });
}

/* ── 실제: Firebase ── */
const FV = '10.12.2', G = m => `https://www.gstatic.com/firebasejs/${FV}/firebase-${m}.js`;
let FB = null;
async function liveDB() {
  const cfg = await (await fetch(API + '?a=config')).json();
  if (!cfg.apiKey) throw new Error('서버 설정(VITE_FIREBASE_*)을 못 받았습니다');
  const [{ initializeApp }, A, F] = await Promise.all([import(G('app')), import(G('auth')), import(G('firestore'))]);
  const app = initializeApp(cfg, 'home');
  const auth = A.getAuth(app);
  let db; try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); } catch (e) { db = F.getFirestore(app); }
  FB = { A, F, auth, db };
  return new Promise(res => A.onAuthStateChanged(auth, u => { USER = u; res(); if (u) startLive(); else gate(); }));
}
let unsubs = [];
function startLive() {
  const { F, db } = FB;
  unsubs.forEach(f => f()); unsubs = [];
  const col = n => F.collection(db, 'homes', 'main', n);
  const fail = e => { if (e.code === 'permission-denied') blocked(); else toast('⚠️ 연결이 끊겼습니다 — 다시 이어지면 저절로 맞춰집니다'); };
  let first = true;
  unsubs.push(F.onSnapshot(F.doc(db, 'homes', 'main'), s => {
    D.members = (s.exists() && s.data().members) || {};
    const email = (USER.email || '').toLowerCase();
    ME = Object.keys(D.members).find(k => (D.members[k].email || '').toLowerCase() === email) || null;
    if (first) { first = false; if (!ME) return whoAmI(); }
    render();
  }, fail));
  const since = { medLogs: C.addDays(today, -2), workLogs: C.addDays(today, -70) };
  COLS.forEach(n => {
    const q = since[n] ? F.query(col(n), F.where('date', '>=', since[n])) : col(n);
    unsubs.push(F.onSnapshot(q, s => { const o = {}; s.forEach(d => { o[d.id] = { id: d.id, ...d.data() }; }); D[n] = o; schedule(); }, fail));
  });
  DB = {
    put: (c, id, data) => F.setDoc(F.doc(db, 'homes', 'main', c, id), data, { merge: true }).catch(e => toast('⚠️ 저장 못 함: ' + e.code)),
    putRoot: data => F.setDoc(F.doc(db, 'homes', 'main'), data, { merge: true }),
  };
}
/* 🔁 옛 형식 → 약 하나씩 (26-10-02 · 한 번만)
   ① 처음 형식  {name, who, times[]}        → 시각마다 시간대로
   ② 세트 형식  {name, who, slot, pills[]}  → 알약마다 하나씩
   같은 (사람, 약 이름) 은 한 약으로 합치고 시간대만 더합니다. id 가 정해져 있어 두 기기가 같이 돌려도 같은 결과
   ⚠️ 옛 것은 지우지 않고 off:true · migrated:true (CLAUDE.md ④) */
let migrated = false;
async function 옛약옮기기() {
  if (migrated || !DB) return;
  const old = Object.values(D.meds).filter(m => !m.off && !(m.slots || []).length && ((m.times || []).length || (m.pills || []).length));
  if (!old.length) return; migrated = true;
  const 시간대 = x => x === '자기 전' ? '저녁' : x;
  const g = {}, add = (who, name, sl, base) => { const id = 'p_' + who + '_' + name.replace(/[\/\s.#$\[\]]/g, '_');
    g[id] = g[id] || { name, who, slots: [], created: base.created || Date.now(), start: base.start || today };
    if (!g[id].slots.includes(sl)) g[id].slots.push(sl); };
  old.forEach(m => {
    if ((m.pills || []).length) m.pills.forEach(p => add(m.who, p, 시간대(m.slot || C.slotOf(m.time || '08:00')), m));
    else m.times.forEach(t => add(m.who, m.name, C.slotOf(t), m));
  });
  for (const [id, v] of Object.entries(g)) { v.slots = C.SLOTS.map(x => x[0]).filter(x => v.slots.includes(x)); await DB.put('meds', id, v); }
  for (const m of old) await DB.put('meds', m.id, { off: true, migrated: true });
  toast(`💊 약을 하나씩 보이게 옮겼습니다 (${Object.keys(g).length}개)`);
}
let rq = 0; function schedule() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }

/* ═════════════ 로그인 화면들 ═════════════ */
function gate() {
  $('#app').innerHTML = `<div class="gate"><h1>🏠 우리집</h1><p>둘만 쓰는 집 대시보드입니다.<br>구글 계정으로 들어와 주세요.</p><button class="btn" id="login">구글로 로그인</button></div>`;
  $('#login').onclick = async () => {
    const { A, auth } = FB, p = new A.GoogleAuthProvider();
    try { await A.signInWithPopup(auth, p); }
    catch (e) { if (/popup/.test(e.code)) A.signInWithRedirect(auth, p); else toast('로그인 실패: ' + e.code); }
  };
}
function blocked() {
  unsubs.forEach(f => f()); unsubs = [];
  $('#app').innerHTML = `<div class="gate"><h1>🚫 들어올 수 없는 계정</h1><p>${esc(USER && USER.email)}<br>우리집 두 사람 계정만 들어올 수 있습니다.</p><button class="btn sec" id="out">다른 계정으로</button></div>`;
  $('#out').onclick = () => FB.A.signOut(FB.auth);
}
function whoAmI() {
  $('#app').innerHTML = `<div class="gate"><h1>👋 처음이네요</h1><p>${esc(USER.email)}<br>이 계정은 누구입니까? (한 번만 물어봅니다)</p>
    <div style="display:flex;gap:10px"><button class="btn" style="background:var(--me)" data-who="me">나</button><button class="btn" style="background:var(--her)" data-who="her">여자친구</button></div></div>`;
  document.querySelectorAll('[data-who]').forEach(b => b.onclick = async () => {
    const w = b.dataset.who, other = D.members[w];
    if (other && other.email && other.email.toLowerCase() !== USER.email.toLowerCase()) return toast(`이미 ${other.email} 로 정해져 있습니다`);
    await DB.putRoot({ members: { [w]: { name: w === 'me' ? '나' : '여자친구', ...(D.members[w] || {}), email: USER.email.toLowerCase() } } });
  });
}

/* ═════════════ 틀 ═════════════ */
const SCR = [['home', '🏠', '홈'], ['med', '💊', '약'], ['cal', '📅', '일정'], ['fridge', '🧊', '냉장고'], ['gym', '💪', '운동'], ['chore', '🧹', '집안일']];
function layout() {
  const tab = tabLayout.matches;
  document.body.classList.toggle('tabL', tab); document.body.classList.toggle('phone', !tab);
}
tabLayout.addEventListener('change', () => { layout(); render(); });

function badges() {
  const b = {};
  const 지금 = C.kst().min;
  const 안먹음 = w => mySets(w).some(지남);
  b.med = isTab() ? (안먹음('me') || 안먹음('her')) : (ME && 안먹음(ME));
  b.chore = choresSorted().some(c => c.next < today && c.lastDone !== today);
  b.fridge = Object.values(D.food).some(f => f.status === '있음' && f.expires && C.diffDays(f.expires, today) <= 0);
  return b;
}
function shell() {
  if ($('#shell')) return;
  $('#app').innerHTML = `<div class="shell" id="shell"><nav class="rail" id="rail"></nav><div class="page"><div class="top" id="top"></div><main id="main"></main><nav class="btm" id="btm"></nav></div></div>`;
}
function navHtml() {
  const b = badges();
  return SCR.map(([k, i, l]) => `<button data-go="${k}" class="${k === cur ? 'on' : ''}"><b>${i}</b>${l}${b[k] ? '<i class="dotn"></i>' : ''}</button>`).join('');
}
let lastHtml = '';
function render() {
  if (!DB) return;
  today = C.kst().date;
  shell(); layout(); 옛약옮기기();
  $('#rail').innerHTML = navHtml() + `<div class="sp"></div><button data-go="set" class="${cur === 'set' ? 'on' : ''}"><b>⚙️</b>설정</button>`;
  $('#btm').innerHTML = navHtml();
  const R = { home: rHome, med: rMed, cal: rCal, fridge: rFridge, gym: rGym, chore: rChore, set: rSet }[cur] || rHome;
  const { top, body, fit } = R();
  $('#top').innerHTML = top || '';
  $('#top').classList.toggle('hide', !top);
  const main = $('#main'); main.classList.toggle('fit', !!fit);
  if (body !== lastHtml) { const y = main.scrollTop; main.innerHTML = body; main.scrollTop = y; lastHtml = body; }
}
function go(k) { cur = k; ls.set('home-cur', k); lastHtml = ''; render(); $('#main').scrollTop = 0; }
const topBar = (title, sub, acts = '') => `<div><h1>${title}</h1>${sub ? `<div class="s">${sub}</div>` : ''}</div><div class="acts">${acts}${document.body.classList.contains('phone') ? `<button class="btn sec sm" data-go="set">⚙️</button>` : ''}</div>`;

/* ═════════════ 공통 계산 ═════════════ */
const taken = key => D.medLogs[key] && D.medLogs[key].taken;
const medList = () => Object.values(D.meds).filter(m => !m.off && (m.slots || []).length);
const mySets = (w, s = today) => C.medsFor(medList(), w, s);   // 이름은 옛것 그대로 · 이제 약 하나씩
const 지남 = x => !taken(x.key) && C.hm2min(x.time) + 60 <= C.kst().min;
const doneMap = () => { const o = {}; Object.entries(D.workLogs).forEach(([k, v]) => { if (v.done) o[k] = 1; }); return o; };
const routines = () => Object.values(D.routines).filter(r => !r.off);
const foods = () => Object.values(D.food).filter(f => f.status === '있음').sort((a, b) => (a.expires || '9999') + (a.added || '') < (b.expires || '9999') + (b.added || '') ? -1 : 1);
const choresSorted = () => Object.values(D.chores).filter(c => !c.off && !(c.once && c.lastDone && c.lastDone < today)).map(c => ({ ...c, next: C.choreNext(c) })).sort((a, b) => a.next < b.next ? -1 : 1);
const whoCls = w => w === 'me' ? 'me' : w === 'her' ? 'her' : w === 'we' ? 'we' : 'any';
function choreSub(c) {
  if (c.once) return `비정기 · ${이름(c.who)}`;
  const n = C.diffDays(c.next, today);
  const when = n < 0 ? `${-n}일 밀림` : n === 0 ? '오늘' : n === 1 ? '내일' : C.label(c.next);
  return `${when} · ${C.everyText(c.every)} · ${이름(c.who)}`;
}
/* 체크 버튼 — 탭이면 사람마다, 폰이면 내 것만 */
function medBtn(x, who) {
  const on = taken(x.key), can = isTab() || who === ME;
  return `<button class="chk ${who} ${on ? 'on' : ''}" data-act="med" data-key="${x.key}" data-mid="${x.med.id}" data-slot="${x.slot}" data-who="${who}" ${can ? '' : 'disabled'} aria-label="${이름(who)} ${esc(x.med.name)}">${on ? '✓' : ''}</button>`;
}
/* 약 한 줄 — 먹으면 줄 긋고 시각 · 노랑 = 지금 먹을 때 · 빨강 = 1시간 지남 */
function medRow(x, w) {
  const on = taken(x.key), t = C.hm2min(x.time), now = C.kst().min, late = !on && now >= t + 60, due = !on && !late && now >= t;
  const log = D.medLogs[x.key];
  return `<div class="pillrow ${w} ${on ? 'done' : ''} ${late ? 'late' : ''} ${due ? 'due' : ''}"><span class="m" data-act="medEdit" data-id="${x.med.id}"><b>${esc(x.med.name)}${x.med.who === 'we' ? ' <span class="tag we">같이</span>' : ''}</b>${on ? `<small>${new Date(log.at).toTimeString().slice(0, 5)} 먹음</small>` : late ? '<small>1시간 지남</small>' : ''}</span>${medBtn(x, w)}</div>`;
}
/* 「따로 한 운동」 — 루틴 말고 갑자기 한 것 (사장님 26-10-02) · 키 날짜_who_x_id
   ⚠️ 26-10-02 약 화면을 고치다 이 두 줄을 같이 지워 홈·운동 화면이 멈췄습니다. 약 코드와 붙여 두지 말 것 */
const adhocToday = who => Object.entries(D.workLogs).filter(([k, v]) => v.done && v.adhoc && v.date === today && (!who || v.who === who)).map(([k, v]) => ({ ...v, key: k }));
const adhocRow = x => `<div class="it"><span class="m"><b>🏃 ${esc(x.name)}</b><small>따로 한 운동 · ${이름(x.who)}${x.memo ? ' · ' + esc(x.memo) : ''}</small></span><button class="chk ${x.who} on" data-act="adhocOff" data-key="${x.key}" ${isTab() || x.who === ME ? '' : 'disabled'} aria-label="빼기">✓</button></div>`;
function workBtns(r) {
  const ws = r.who === 'we' ? ['me', 'her'] : [r.who];
  return ws.map(w => { const k = `${today}_${w}_${r.id}`, on = D.workLogs[k] && D.workLogs[k].done, can = isTab() || w === ME;
    return `<button class="chk ${w} ${on ? 'on' : ''}" data-act="work" data-rid="${r.id}" data-who="${w}" ${can ? '' : 'disabled'} aria-label="${이름(w)} ${esc(r.name)}">${on ? '✓' : ''}</button>`; }).join('');
}

/* ═════════════ 🏠 홈 ═════════════ */
function 긴날짜(s) { const [, m, d] = s.split('-').map(Number); return `${m}월 ${d}일 ${C.DAY[C.wdOf(s)]}요일`; }
function evLine(e, past) {
  const col = { me: 'var(--me)', her: 'var(--her)', we: 'var(--we)' }[e.who] || 'var(--any)';
  return `<div class="ev ${past ? 'past' : ''}"><span class="h num">${e.time || '종일'}</span><span class="b" style="border-color:${col}">${esc(e.title)}<small>${이름(e.who)}</small></span></div>`;
}
function choreLine(c) {
  const done = c.lastDone === today, cls = c.who === 'her' ? 'her' : c.who === 'me' ? 'me' : 'any';
  return `<div class="it ${done ? 'done' : ''}"><span class="m ${!done && c.next < today ? 'late' : ''}"><b>${esc(c.name)}${c.once ? ' <span class="once">한 번만</span>' : ''}</b><small>${done ? `✓ 오늘 했음 · ${이름(c.lastBy || c.who)}${c.once ? '' : ` · 다음 ${C.label(c.next)}`}` : choreSub(c)}</small></span><button class="chk ${cls} ${done ? 'on' : ''}" data-act="chore" data-id="${c.id}" aria-label="${esc(c.name)} ${done ? '되돌리기' : '했음'}">${done ? '✓' : ''}</button></div>`;
}
/* 🏠 홈의 집안일 — 사장님: 「홈 화면에서 할 일을 보여주기만」 → 체크 없이 목록만. 체크는 집안일 화면에서 */
function homeChores(max) {
  const list = choresSorted().filter(c => c.lastDone !== today && c.next <= today);
  const rows = list.slice(0, max).map(c => `<div class="it" data-go="chore" style="cursor:pointer"><span class="m ${c.next < today ? 'late' : ''}"><b>${esc(c.name)}${c.once ? ' <span class="once">비정기</span>' : ''}</b><small>${choreSub(c)}</small></span></div>`).join('');
  const done = choresSorted().filter(c => c.lastDone === today).length;
  return { rows: (rows || '<div class="empty">오늘 할 집안일 없음 👍</div>') + (done ? `<div class="more">✓ 오늘 ${done}개 함</div>` : ''), more: list.length > max ? list.length - max : 0 };
}
function homeFood(max) {
  const list = foods().filter(f => f.expires && C.diffDays(f.expires, today) <= 3);
  const rows = list.slice(0, max).map(f => { const d = C.dday(f.expires, today); return `<div class="it"><span class="m" ${d.n < 0 ? 'style="color:var(--off)"' : ''}><b>${esc(f.name)}</b><small>${f.place}</small></span><span class="dd ${d.cls}">${d.text}</span></div>`; }).join('');
  return { rows: rows || '<div class="empty">3일 안에 먹을 것 없음</div>', more: list.length > max ? list.length - max : 0 };
}
function rHome() {
  const now = C.kst(), evs = Object.values(D.events);
  const 오늘일정 = C.eventsOn(evs, today), 내일일정 = C.eventsOn(evs, C.addDays(today, 1));
  if (!isTab() || !document.body.classList.contains('tabL')) return rHomePhone(오늘일정, 내일일정);
  const ch = homeChores(4), fd = homeFood(4), rs = routines();
  const todayR = rs.filter(r => C.routineOn(r, today));
  const dm = doneMap();
  const medMini = w => { const xs = mySets(w), left = xs.filter(x => !taken(x.key) && C.hm2min(x.time) <= now.min + 60);
    return `<div><div class="who" style="color:var(--${w})">${이름(w)} <span style="color:var(--muted);font-weight:600">${xs.length - left.length}/${xs.length}</span></div>${left.slice(0, 3).map(x => `<div class="it" style="min-height:46px;padding:6px 0"><span class="m ${지남(x) ? 'late' : ''}"><b>${esc(x.med.name)}</b><small>${x.slot}${지남(x) ? ' · 안 먹음' : ''}</small></span>${medBtn(x, w)}</div>`).join('') || '<div class="empty">없음</div>'}${left.length > 3 ? `<div class="more">+${left.length - 3}</div>` : !left.length && xs.length ? '<div class="more">✓ 지금까지 다 먹음</div>' : ''}</div>`; };
  const body = `<div class="home">
    <div class="card clock"><div style="min-height:0;overflow:hidden">
      <div class="tm num">${now.time}</div><div class="dt">${긴날짜(today)}</div>
      <div class="tl">${오늘일정.length ? 오늘일정.slice(0, 5).map(e => evLine(e, e.time && C.hm2min(e.time) < now.min)).join('') : '<div class="day">오늘 일정 없음</div>'}
        <div class="day">내일</div>${내일일정.slice(0, 3).map(e => evLine(e)).join('') || '<div class="day" style="opacity:.4">없음</div>'}</div></div>
      <div class="foot"><span>${wakeOn ? '🔆 화면 계속 켜짐' : ''}</span><span>${DEMO ? '미리보기' : '🔄 실시간'}</span></div></div>
    <div class="card"><h3>💊 오늘 약 <button class="go" data-go="med">전체 ›</button></h3><div class="twin">${medMini('me')}${medMini('her')}</div></div>
    <div class="card"><h3>🧊 곧 먹어야 할 것 <button class="go" data-go="fridge">냉장고 ›</button></h3>${fd.rows}${fd.more ? `<div class="more">+${fd.more}개 더</div>` : ''}</div>
    <div class="card"><h3>🧹 집안일 <button class="go" data-go="chore">전체 ›</button></h3>${ch.rows}${ch.more ? `<div class="more">+${ch.more}개 더</div>` : ''}</div>
    <div class="card"><h3>💪 오늘 운동 <small>🔥 ${이름('me')} ${C.streak(rs, dm, 'me', today)}일 · ${이름('her')} ${C.streak(rs, dm, 'her', today)}일</small></h3>
      ${todayR.slice(0, 4).map(r => `<div class="it"><span class="m"><b>${esc(r.name)}</b><small>${이름(r.who)}</small></span>${workBtns(r)}</div>`).join('')}
      ${adhocToday().slice(0, Math.max(0, 4 - todayR.length)).map(adhocRow).join('')}
      ${!todayR.length && !adhocToday().length ? '<div class="empty">오늘 운동 없음</div>' : ''}
      <button class="btn sec sm" data-act="adhocNew" style="margin-top:auto;align-self:flex-start">＋ 따로 한 운동</button></div>
  </div>`;
  return { body, fit: true };
}
function rHomePhone(오늘일정, 내일일정) {
  const now = C.kst(), who = isTab() ? null : ME;
  const ws = who ? [who] : ['me', 'her'];
  const meds = ws.flatMap(w => mySets(w).map(x => ({ ...x, w })));

    ${상대안먹음.length ? `<div class="banner"><span>⏰ ${이름(pw)} — ${[...new Set(상대안먹음.map(x => x.slot))].join('·')} 약 ${상대안먹음.length}개 아직 안 먹음</span><button class="btn sm" data-act="poke" data-who="${pw}">🔔 알려주기</button></div>` : ''}

    <div class="card"><h3>🧹 오늘 집안일 <button class="go" data-go="chore">전체 ›</button></h3>${ch.rows}${ch.more ? `<div class="more">+${ch.more}개 더</div>` : ''}</div>
    <div class="card"><h3>💪 ${who ? '내 운동' : '오늘 운동'} <button class="go" data-go="gym">›</button></h3>${myR.map(r => `<div class="it"><span class="m"><b>${esc(r.name)}</b><small>${이름(r.who)}</small></span>${workBtns(r)}</div>`).join('')}${adhocToday(who).map(adhocRow).join('')}${!myR.length && !adhocToday(who).length ? '<div class="empty">오늘 운동 없음</div>' : ''}
      <button class="btn sec sm" data-act="adhocNew" style="margin-top:8px;align-self:flex-start">＋ 따로 한 운동</button></div>
    <div class="card"><h3>🧊 곧 먹어야 할 것 <button class="go" data-go="fridge">›</button></h3>${fd.rows}</div>
    <div class="card"><h3>📅 오늘 · 내일 <button class="go" data-go="cal">›</button></h3>
      ${오늘일정.map(e => `<div class="it"><span class="dot c-${whoCls(e.who)}"></span><span class="m"><b>${esc(e.title)}</b><small>오늘 ${e.time || '종일'} · ${이름(e.who)}</small></span></div>`).join('')}
      ${내일일정.map(e => `<div class="it"><span class="dot c-${whoCls(e.who)}"></span><span class="m"><b>${esc(e.title)}</b><small>내일 ${e.time || '종일'} · ${이름(e.who)}</small></span></div>`).join('')}

}

/* ═════════════ 💊 약 ═════════════ */
/* 💊 약 (26-10-02 두 번째) — 사장님: 「세트 없애고 각각」 「먹는 사람이 따로라 가시적으로 잘 나눠져야」
   아침·점심·저녁 줄 × 나 | 여자친구 칸 · 폰에서도 두 사람 다 보임 (내 것만 체크) */
function rMed() {
  const nowSlot = C.slotOf(C.kst().time);
  const prog = w => { const xs = mySets(w); return `<div class="prog ${w}">${이름(w)} <b class="num">${xs.filter(x => taken(x.key)).length}/${xs.length}</b></div>`; };
  const tabL = document.body.classList.contains('tabL');

  let body = tabL
    ? `<div class="mgrid"><div></div><div class="mh me">● ${이름('me')}</div><div class="mh her">● ${이름('her')}</div>
        ${C.SLOTS.map(([sl, t]) => `<div class="slotlab ${sl === nowSlot ? 'now' : ''}">${sl}<small>${t}${sl === nowSlot ? ' · 지금' : ''}</small></div><div class="cell">${cell('me', sl)}</div><div class="cell">${cell('her', sl)}</div>`).join('')}</div>`

  if (!isTab()) { const pw = ME === 'me' ? 'her' : 'me'; if (mySets(pw).some(지남)) body = `<div class="banner"><span>⏰ ${이름(pw)} 아직 안 먹은 약이 있어요</span><button class="btn sm" data-act="poke" data-who="${pw}">🔔 알려주기</button></div>` + body; }
  const list = medList().sort((a, b) => a.who < b.who ? -1 : a.name < b.name ? -1 : 1);
  body += `<div class="card" style="margin-top:16px"><h3>약 목록 <small>누르면 고치거나 뺄 수 있습니다</small></h3>
      ${list.map(m => `<div class="it" data-act="medEdit" data-id="${m.id}" style="cursor:pointer"><span class="dot c-${whoCls(m.who)}"></span><span class="m"><b>${esc(m.name)}</b><small>${이름(m.who)} · ${(m.slots || []).join(' · ')}${m.memo ? ' · ' + esc(m.memo) : ''}</small></span><span style="color:var(--muted)">›</span></div>`).join('') || '<div class="empty">아직 없음 — 「＋ 약」</div>'}</div>
    <p style="color:var(--muted);font-size:13px;margin-top:10px">🔔 아침 08:00 · 점심 12:30 · 저녁 19:00 에 먹을 사람에게, 1시간이 지나도 체크가 없으면 두 사람 모두와 거실 탭에 알림</p>`;
  return { top: topBar('💊 약', `${C.label(today)} · 지금은 ${nowSlot}`, `${prog('me')}${prog('her')}<button class="btn" data-act="medNew">＋ 약</button>`), body };
}

/* ═════════════ 📅 일정 ═════════════ */
let calMode = ls.get('home-calmode', 'week'), calAnchor = null, calSel = null;
function choreDue(s) { return choresSorted().filter(c => c.next === s || (s === today && c.next < today)); }
function evChip(e, s) { return `<div class="e ${whoCls(e.who)}" data-act="evEdit" data-id="${e.id}" data-day="${s}">${esc(e.title)}${e.time ? `<small>${e.time}</small>` : ''}</div>`; }
function rCal() {
  const a = calAnchor || today, evs = Object.values(D.events);
  let body, sub;
  if (calMode === 'week') {
    const start = C.addDays(a, -C.wdOf(a));
    sub = `${C.label(start)} ~ ${C.label(C.addDays(start, 6))}`;
    body = `<div class="week">${[0, 1, 2, 3, 4, 5, 6].map(i => { const s = C.addDays(start, i);
      return `<div class="wday ${s === today ? 'today' : ''}" data-act="evNew" data-day="${s}"><div class="dh"><b>${+s.slice(8)}</b>${C.DAY[i]}${s === today ? ' · 오늘' : ''}</div>
        ${C.eventsOn(evs, s).map(e => evChip(e, s)).join('')}${choreDue(s).map(c => `<div class="e chore">🧹 ${esc(c.name)}</div>`).join('')}</div>`; }).join('')}</div>`;
  } else {
    const [y, m] = a.split('-').map(Number), first = `${y}-${String(m).padStart(2, '0')}-01`, start = C.addDays(first, -C.wdOf(first));
    sub = `${y}년 ${m}월`;
    const sel = calSel || today;
    let cells = '';
    for (let i = 0; i < 42; i++) { const s = C.addDays(start, i), es = C.eventsOn(evs, s);
      cells += `<div class="mc ${s.slice(0, 7) !== first.slice(0, 7) ? 'o' : ''} ${s === today ? 'today' : ''} ${s === sel ? 'sel' : ''}" data-act="calSel" data-day="${s}"><b class="num">${+s.slice(8)}</b>
        ${document.body.classList.contains('tabL') ? es.slice(0, 2).map(e => `<span class="tx p-${whoCls(e.who)}">${esc(e.title)}</span>`).join('') + (es.length > 2 ? `<span style="font-size:11px;color:var(--muted)">+${es.length - 2}</span>` : '') : `<span class="bars">${es.slice(0, 3).map(e => `<i class="bar c-${whoCls(e.who)}"></i>`).join('')}</span>`}</div>`; }
    const es = C.eventsOn(evs, sel);
    body = `<div class="month">${C.DAY.map(d => `<div class="h">${d}</div>`).join('')}${cells}</div>
      <div class="card" style="margin-top:12px"><h3>${C.label(sel)} <button class="btn sm" data-act="evNew" data-day="${sel}">＋ 이날 일정</button></h3>
        ${es.map(e => `<div class="it" data-act="evEdit" data-id="${e.id}" data-day="${sel}" style="cursor:pointer"><span class="dot c-${whoCls(e.who)}"></span><span class="m"><b>${esc(e.title)}</b><small>${e.time || '종일'} · ${이름(e.who)} · ${repText(e.repeat)}</small></span></div>`).join('') || '<div class="empty">일정 없음</div>'}</div>`;
  }
  const acts = `<button class="btn sec sm" data-act="calMove" data-d="-1">‹</button><div class="seg" style="width:120px"><button class="${calMode === 'week' ? 'on' : ''}" data-act="calMode" data-v="week">주</button><button class="${calMode === 'month' ? 'on' : ''}" data-act="calMode" data-v="month">월</button></div><button class="btn sec sm" data-act="calMove" data-d="1">›</button><button class="btn sec sm" data-act="calToday">오늘</button><button class="btn" data-act="evNew" data-day="${calSel || today}">＋ 일정</button>`;
  return { top: topBar('📅 일정', sub, acts), body: body + `<p style="color:var(--muted);font-size:13px;margin-top:10px">점선 = 집안일 예정 · 🔔 시간이 있는 일정은 1시간 전에, 일정 있는 날은 아침 8시에 알림</p>` };
}
function repText(r) { r = r || {}; return { weekly: '매주 ' + (r.days || []).map(d => C.DAY[d]).join('·'), monthly: '매월', yearly: '매년', everyN: `${r.n}일마다` }[r.type] || '한 번'; }

/* ═════════════ 🧊 냉장고 ═════════════ */
let frPlace = '전체';
function foodRow(f) {
  // 냉동은 기한 없이 「넣은 날」만 (사장님 26-10-02) → 며칠째인지
  const d = f.expires ? C.dday(f.expires, today) : { n: 9, cls: 'n', text: `${C.diffDays(today, f.added || today) + 1}일째` };
  return `<div class="it"><span class="m" ${d.n < 0 ? 'style="color:var(--off)"' : ''}><b>${esc(f.name)}</b><small>${C.label(f.added || today)} 넣음${f.expires ? ` · ${C.label(f.expires)}까지` : ''}${f.qty ? ' · ' + esc(f.qty) : ''}</small></span><span class="dd ${d.cls}">${d.text}</span>
    <button class="btn sec sm" data-act="foodOut" data-id="${f.id}" data-v="다먹음">다 먹음</button><button class="btn sec sm" data-act="foodOut" data-id="${f.id}" data-v="버림" style="color:var(--bad)">버림</button></div>`; }
function rFridge() {
  const all = foods(), P = ['냉장', '냉동', ...(foods().some(f => f.place === '실온') ? ['실온'] : [])];
  const cnt = p => all.filter(f => f.place === p).length;
  let body;
  if (document.body.classList.contains('tabL')) {
    body = `<div class="fr" style="grid-template-columns:repeat(${P.length},1fr)">${P.map(p => `<div class="card"><h3>${p} <small>${cnt(p)}</small></h3>${all.filter(f => f.place === p).map(foodRow).join('') || '<div class="empty">비어 있음</div>'}</div>`).join('')}</div>`;
  } else {
    const list = frPlace === '전체' ? all : all.filter(f => f.place === frPlace);
    body = `<div class="seg" style="margin-bottom:10px">${['전체', ...P].map(p => `<button class="${frPlace === p ? 'on' : ''}" data-act="frPlace" data-v="${p}">${p} ${p === '전체' ? all.length : cnt(p)}</button>`).join('')}</div>
      <div class="card">${list.map(foodRow).join('') || '<div class="empty">비어 있음</div>'}</div>`;
  }
  body += `<p style="color:var(--muted);font-size:13px;margin-top:10px"><span class="dd r">빨강</span> 오늘·내일 <span class="dd y">노랑</span> 2~3일 <span class="dd g">회색</span> 지남 · 냉동은 기한 없이 넣은 지 며칠째인지만</p>`;
  return { top: topBar('🧊 냉장고', `${all.length}개 · 기한 가까운 순`, `<button class="btn sec" data-act="foodLog">📜 기록</button><button class="btn" data-act="foodNew">＋ 넣기</button>`), body };
}

/* ═════════════ 💪 운동 ═════════════ */
function rGym() {
  const rs = routines(), dm = doneMap(), todayR = rs.filter(r => C.routineOn(r, today));
  const [y, m] = today.split('-').map(Number), first = today.slice(0, 8) + '01', last = C.lastDay(y, m);
  let cells = C.DAY.map(d => `<i class="h">${d}</i>`).join('') + '<i style="background:none"></i>'.repeat(C.wdOf(first));
  for (let d = 1; d <= last; d++) { const s = today.slice(0, 8) + String(d).padStart(2, '0'), a = C.dayDone(rs, dm, 'me', s), b = C.dayDone(rs, dm, 'her', s);
    cells += `<i class="${a && b ? 'ab' : a ? 'a' : b ? 'b' : ''} ${s === today ? 'td' : ''}">${d}</i>`; }
  const body = `<div class="cols" style="grid-template-columns:${document.body.classList.contains('tabL') ? '1fr 1fr' : '1fr'}">
    <div class="card"><h3>오늘</h3>
      <div class="streaks"><div style="background:var(--me-bg);color:var(--me)">${이름('me')}<b class="num">${C.streak(rs, dm, 'me', today)}일</b>연속</div><div style="background:var(--her-bg);color:var(--her)">${이름('her')}<b class="num">${C.streak(rs, dm, 'her', today)}일</b>연속</div></div>
      ${todayR.map(r => `<div class="it"><span class="m"><b>${esc(r.name)}</b><small>${schedText(r.sched)} · ${이름(r.who)}</small></span>${workBtns(r)}</div>`).join('')}
      ${adhocToday().map(adhocRow).join('')}
      ${!todayR.length && !adhocToday().length ? '<div class="empty">오늘 운동 없음</div>' : ''}</div>
    <div class="card"><h3>${m}월 <small>파랑 ${이름('me')} · 분홍 ${이름('her')} · 반반 둘 다</small></h3><div class="gcal">${cells}</div>
      <div class="more">그날 할 운동을 다 해야 칸이 칠해집니다 · 다 하면 상대 폰과 거실 탭에 알림</div></div>
    <div class="card" style="${document.body.classList.contains('tabL') ? 'grid-column:1 / 3' : ''}"><h3>루틴 <small>누르면 고치거나 뺄 수 있습니다</small></h3>
      ${rs.map(r => `<div class="it" data-act="rtEdit" data-id="${r.id}" style="cursor:pointer"><span class="dot c-${whoCls(r.who)}"></span><span class="m"><b>${esc(r.name)}</b><small>${schedText(r.sched)} · ${이름(r.who)}</small></span><span style="color:var(--muted)">›</span></div>`).join('') || '<div class="empty">루틴이 없습니다</div>'}</div>
  </div>`;
  return { top: topBar('💪 운동', C.label(today), `<button class="btn" data-act="adhocNew">＋ 따로 한 운동</button><button class="btn sec" data-act="rtNew">＋ 루틴</button>`), body };
}
function schedText(sc) { sc = sc || {}; return sc.type === 'days' ? (sc.days || []).map(d => C.DAY[d]).join('·') : sc.type === 'everyN' ? `${sc.n}일마다` : '매일'; }

/* ═════════════ 🧹 집안일 ═════════════ */
/* 🧹 집안일 (26-10-02 세 번째) — 사장님: 「딱 2개야 정기적 업무 · 비정기적 업무
     정기적 = 매주 / 격주 / 매달 · 비정기적 = 그냥 추가 · 등록은 상단에 · 간단하게 표로」
   표 순서: 밀림 → 오늘 → 오늘 한 것 → 다가오는 것 */
const CYCLES = [['7', '매주', { type: 'days', n: 7 }], ['14', '격주', { type: 'days', n: 14 }], ['m', '매달', { type: 'monthly' }]];
let CF = { name: '', type: '정기', cycle: '7', who: 'any' };   // 위 등록 칸 (다시 그려도 안 날아가게)
function rChore() {
  const all = choresSorted(), 함 = c => c.lastDone === today;
  const rank = c => 함(c) ? 2 : c.next < today ? 0 : c.next === today ? 1 : 3;
  const rows = all.slice().sort((a, b) => rank(a) - rank(b) || (a.next < b.next ? -1 : 1));
  const cls = c => c.who === 'her' ? 'her' : c.who === 'me' ? 'me' : 'any';
  const 상태 = c => { if (함(c)) return `<span class="st ok">✓ 오늘 함</span>`; const n = C.diffDays(c.next, today);
    return n < 0 ? `<span class="st bad">${-n}일 밀림</span>` : n === 0 ? `<span class="st now">오늘</span>` : c.once ? '' : `<span class="st">${n}일 뒤 · ${C.label(c.next)}</span>`; };
  const form = `<div class="card cform">
      <input class="field" id="chName" data-cf="name" value="${esc(CF.name)}" placeholder="할 일 이름 (예: 화장실 청소)" autocomplete="off">
      <div class="seg"><button class="${CF.type === '정기' ? 'on' : ''}" data-act="cf" data-k="type" data-v="정기">정기</button><button class="${CF.type === '비정기' ? 'on' : ''}" data-act="cf" data-k="type" data-v="비정기">비정기</button></div>
      ${CF.type === '정기' ? `<div class="seg">${CYCLES.map(([k, l]) => `<button class="${CF.cycle === k ? 'on' : ''}" data-act="cf" data-k="cycle" data-v="${k}">${l}</button>`).join('')}</div>` : ''}
      <div class="seg">${[['any', '아무나'], ['me', 이름('me')], ['her', 이름('her')]].map(([k, l]) => `<button class="${CF.who === k ? 'on' : ''}" data-act="cf" data-k="who" data-v="${k}">${l}</button>`).join('')}</div>
      <button class="btn" data-act="cfSave">등록</button></div>`;
  const table = `<div class="card ctable"><div class="tr th"><span>할 일</span><span>구분</span><span>상태</span><span>마지막</span><span></span></div>
    ${rows.map(c => `<div class="tr ${함(c) ? 'done' : ''} ${!함(c) && c.next < today ? 'late' : ''}">
      <span class="nm" data-act="chEdit" data-id="${c.id}"><b>${esc(c.name)}</b><small>${이름(c.who)}${c.once ? '' : ' · ' + C.everyText(c.every)}</small></span>
      <span>${c.once ? '<span class="once">비정기</span>' : `<span class="reg">${C.everyText(c.every)}</span>`}</span>
      <span>${상태(c)}</span>
      <span class="last">${c.lastDone ? C.label(c.lastDone) : '–'}</span>
      <span><button class="chk ${cls(c)} ${함(c) ? 'on' : ''}" data-act="chore" data-id="${c.id}" aria-label="${esc(c.name)} ${함(c) ? '되돌리기' : '했음'}">${함(c) ? '✓' : ''}</button></span></div>`).join('') || '<div class="empty">위에서 등록해 주세요</div>'}</div>`;
  return { top: topBar('🧹 집안일', '체크하면 그날부터 다시 셉니다 · 이름을 누르면 고치기·빼기'), body: form + table };
}

function setF(path, v) { const ks = path.split('.'); let o = F; ks.slice(0, -1).forEach(k => { o[k] = o[k] || {}; o = o[k]; }); o[ks[ks.length - 1]] = v; }
function getF(path) { return path.split('.').reduce((o, k) => o && o[k], F); }
function refreshSaveBtn() { return; const b = $('#sheet [data-act$="Save"]'); if (!b) return;
  const ok = { med: F.name && (F.pills || []).length, ev: F.title && F.date, food: F.name, rt: F.name, ch: F.name, adhoc: F.name, rename: F.name }[sheetKind];
  b.disabled = !ok; }

/* ═════════════ 누르기 ═════════════ */
let tt; function toast(t, undo) { const el = $('#toast'); el.innerHTML = esc(t) + (undo ? ' <button id="undo">되돌리기</button>' : ''); el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), undo ? 5000 : 2200); if (undo) $('#undo').onclick = () => { el.classList.remove('show'); undo(); }; }
const by = w => isTab() ? 'tab' : (ME || w);
async function token() { return DEMO ? '' : FB.auth.currentUser.getIdToken(); }
async function api(body) {
  if (DEMO) { console.log('[미리보기] 알림 안 보냄', body); return { ok: true }; }
  try { const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...body, token: await token() }) }); return await r.json(); }
  catch (e) { return { ok: false, error: e.message }; }
}

document.addEventListener('click', async e => {
  if (e.target.id === 'ov') return closeSheet();
  if (e.target.closest('#night')) { nightSnooze = Date.now(); return night(); }
  /* ⚠️ 26-10-02 「넣기 먹통」 — 아이폰 한글 입력은 글자를 다 치기 전에는 값이 안 넘어올 때가 있어
        이름이 빈 것으로 보고 버튼이 꺼져 있거나 그냥 return 했습니다
     → 누를 때마다 판의 칸을 직접 다시 읽고, 저장 버튼은 끄지 않고 빠진 게 있으면 말로 알려줌 */
  if ($('#ov').classList.contains('show')) document.querySelectorAll('#sheet [data-in]').forEach(el => setF(el.dataset.in, el.value));
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  // 아래 판 안의 고르기
  const fb = e.target.closest('[data-f]'); if (fb) { setF(fb.dataset.f, fb.dataset.num ? +fb.dataset.v : fb.dataset.v);
    return drawSheet(); }
  const ft = e.target.closest('[data-ftog]'); if (ft) { const k = ft.dataset.ftog, v = /days$/.test(k) ? +ft.dataset.v : ft.dataset.v;
    const arr = [...(getF(k) || (k === 'repeat.days' ? [C.wdOf(F.date)] : []))]; const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1);
    setF(k, typeof v === 'number' ? arr.sort() : arr.sort()); return drawSheet(); }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case 'close': return closeSheet();
    /* 약 */
    case 'med': { const key = b.dataset.key, on = taken(key), w = b.dataset.who, md = D.meds[b.dataset.mid] || {};
      await DB.put('medLogs', key, { date: today, medId: b.dataset.mid, slot: b.dataset.slot, who: w, taken: !on, at: Date.now(), by: by(w) });
      if (!on) toast(`💊 ${이름(w)} · ${md.name || ''} 먹음`); return; }
    case 'poke': { b.disabled = true; const w = b.dataset.who;
      const xs = mySets(w).filter(x => !taken(x.key) && C.hm2min(x.time) <= C.kst().min);
      const r = await api({ a: 'poke', to: w, text: xs.map(x => `${x.slot} ${x.med.name}`).join(', ') });
      toast(r.ok ? `🔔 ${이름(w)}에게 보냈습니다` : '⚠️ 못 보냈습니다: ' + (r.error || '')); return; }
    case 'medNew': return openSheet('med', { name: '', who: isTab() ? 'we' : (ME || 'we'), slots: [C.slotOf(C.kst().time)], memo: '' });
    case 'medEdit': return openSheet('med', D.meds[id]);
    case 'medSave': { const name = (F.name || '').trim(); if (!name) return toast('약 이름을 적어 주세요'); if (!(F.slots || []).length) return toast('아침·점심·저녁 중 하나는 골라 주세요');
      const nid = F.id || uid();
      await DB.put('meds', nid, { name, who: F.who, slots: C.SLOTS.map(x => x[0]).filter(x => F.slots.includes(x)), memo: F.memo || '', ...(F.id ? {} : { created: Date.now(), start: today }) });
      closeSheet(); return toast(F.id ? '저장했습니다' : `💊 ${name} 넣었습니다`); }
    case 'medOff': { const mid = F.id, name = F.name; await DB.put('meds', mid, { off: true, offAt: Date.now() }); closeSheet(); return toast(`${name} 뺐습니다`, () => DB.put('meds', mid, { off: false })); }

    /* 일정 */
    case 'calMode': calMode = b.dataset.v; ls.set('home-calmode', calMode); lastHtml = ''; return render();
    case 'calMove': { const d = +b.dataset.d, base = calAnchor || today;
      if (calMode === 'week') calAnchor = C.addDays(base, 7 * d);
      else { const [y, m] = base.split('-').map(Number), nm = m + d, yy = y + Math.floor((nm - 1) / 12), mm = ((nm - 1) % 12 + 12) % 12 + 1; calAnchor = `${yy}-${String(mm).padStart(2, '0')}-01`; }
      return render(); }
    case 'calToday': calAnchor = null; calSel = null; return render();
    case 'calSel': calSel = b.dataset.day; return render();
    case 'evNew': return openSheet('ev', { title: '', who: isTab() ? 'we' : (ME || 'we'), date: b.dataset.day || today, time: '', repeat: { type: 'none' } });
    case 'evEdit': e.stopPropagation(); return openSheet('ev', { ...D.events[id], _day: b.dataset.day });
    case 'evSave': { const nid = F.id || uid(), r = { ...(F.repeat || { type: 'none' }) };
      if (r.type === 'weekly' && !(r.days && r.days.length)) r.days = [C.wdOf(F.date)];
      if (r.type === 'everyN') r.n = Math.max(1, +r.n || 3);
      await DB.put('events', nid, { title: F.title.trim(), who: F.who, date: F.date, time: F.time || '', repeat: r, until: r.type === 'none' ? '' : (F.until || '') });
      closeSheet(); return toast('📅 저장했습니다'); }
    case 'evSkip': { const ev = D.events[F.id]; await DB.put('events', F.id, { skip: [...(ev.skip || []), F._day] }); closeSheet(); return toast(`${C.label(F._day)} 만 뺐습니다`); }
    case 'evOff': { const ev = D.events[F.id], rep = ev.repeat && ev.repeat.type !== 'none';
      if (rep && F._day && F._day > ev.date) await DB.put('events', F.id, { until: C.addDays(F._day, -1) });
      else await DB.put('events', F.id, { off: true });
      closeSheet(); return toast('뺐습니다'); }
    /* 냉장고 */
    case 'frPlace': frPlace = b.dataset.v; return render();
    case 'foodNew': return openSheet('food', { name: '', place: '냉장', hasExp: false, days: 3, qty: '' });
    case 'foodPick': { F.name = b.dataset.v; const prev = Object.values(D.food).filter(f => f.name === F.name).sort((x, y) => (y.added || '') < (x.added || '') ? -1 : 1)[0];
      if (prev) { F.place = prev.place === '냉동' ? '냉동' : '냉장'; } return drawSheet(); }
    case 'hasExp': F.hasExp = !F.hasExp; return drawSheet();
    case 'foodSave': { if (!(F.name || '').trim()) return toast('이름을 적어 주세요');
      // 사장님: 「소비기한 있습니다」를 고르면 1~6일 · 안 고르면 기본 7일 · 냉동은 기한 없음
      const exp = F.place === '냉동' ? '' : C.addDays(today, F.hasExp ? Math.min(6, Math.max(1, +F.days || 3)) : 7);
      await DB.put('food', uid(), { name: F.name.trim(), place: F.place, added: today, expires: exp, qty: F.qty || '', status: '있음', by: by(), at: Date.now() });
      closeSheet(); return toast(`🧊 ${F.name.trim()} 넣었습니다${exp ? ` · ${C.label(exp)}까지` : ' · 냉동'}`); }
    case 'foodOut': { const f = D.food[id], v = b.dataset.v === '버림' ? '버림' : '다먹음';
      await DB.put('food', id, { status: v, outAt: Date.now(), outDay: today, outBy: by() });
      return toast(`${f.name} — ${v === '버림' ? '버림' : '다 먹음'}`, () => DB.put('food', id, { status: '있음' })); }
    case 'foodLog': return openSheet('foodLog', {});
    case 'foodBack': await DB.put('food', id, { status: '있음' }); return drawSheet();
    /* 운동 */
    case 'work': { const w = b.dataset.who, rid = b.dataset.rid, k = `${today}_${w}_${rid}`, on = D.workLogs[k] && D.workLogs[k].done;
      const before = C.dayDone(routines(), doneMap(), w, today);
      await DB.put('workLogs', k, { date: today, who: w, rid, done: !on, at: Date.now(), by: by(w) });
      const dm = doneMap(); if (!on) dm[k] = 1; else delete dm[k];
      if (!on && !before && C.dayDone(routines(), dm, w, today)) { toast(`💪 ${이름(w)} 오늘 운동 끝! 🔥 ${C.streak(routines(), dm, w, today)}일 연속`); api({ a: 'workout', who: w, text: '오늘 할 운동을 다 했어요' }); }
      return; }
    case 'adhocNew': return openSheet('adhoc', { who: isTab() ? 'me' : (ME || 'me'), name: '', memo: '' });
    case 'adhocSave': { const w = F.who, name = (F.name || '').trim(); if (!name) return;
      await DB.put('workLogs', `${today}_${w}_x_${uid()}`, { date: today, who: w, adhoc: true, name, memo: F.memo || '', done: true, at: Date.now(), by: by(w) });
      closeSheet(); toast(`🏃 ${이름(w)} · ${name} 기록 · 🔥 ${C.streak(routines(), doneMap(), w, today)}일 연속`);
      api({ a: 'workout', who: w, text: `${name}${F.memo ? ' · ' + F.memo : ''}` }); return; }
    case 'adhocOff': { const k = b.dataset.key, v = D.workLogs[k]; await DB.put('workLogs', k, { done: false }); return toast(`${v.name} 뺐습니다`, () => DB.put('workLogs', k, { done: true })); }
    case 'rtNew': return openSheet('rt', { name: '', who: isTab() ? 'we' : (ME || 'we'), sched: { type: 'daily' } });
    case 'rtEdit': return openSheet('rt', D.routines[id]);
    case 'rtSave': { const nid = F.id || uid(), sc = { ...(F.sched || { type: 'daily' }) };
      if (sc.type === 'everyN') { sc.n = Math.max(1, +sc.n || 2); sc.start = sc.start || today; }
      await DB.put('routines', nid, { name: F.name.trim(), who: F.who, sched: sc }); closeSheet(); return toast('💪 저장했습니다'); }
    case 'rtOff': { const rid = F.id; await DB.put('routines', rid, { off: true }); closeSheet(); return toast('뺐습니다', () => DB.put('routines', rid, { off: false })); }
    /* 집안일 */
    case 'chore': { const c = D.chores[id];
      if (c.lastDone === today) { await DB.put('chores', id, { lastDone: c.prevDone || '', lastBy: c.prevBy || '' }); return toast(`${c.name} — 되돌렸습니다`); }
      const prev = c.lastDone || '';
      await DB.put('chores', id, { lastDone: today, lastBy: ME && !isTab() ? ME : (c.who === 'me' || c.who === 'her' ? c.who : 'tab'), prevDone: prev, prevBy: c.lastBy || '' });
      await DB.put('choreLogs', uid(), { choreId: id, date: today, by: by(), at: Date.now() }).catch(() => {});
      const nx = C.choreNext({ ...c, lastDone: today });
      return toast(`🧹 ${c.name} 완료 · 다음 ${C.label(nx)}`, () => DB.put('chores', id, { lastDone: prev })); }
    case 'cf': CF[b.dataset.k] = b.dataset.v; CF.name = ($('#chName') || {}).value || CF.name; lastHtml = ''; return render();
    case 'cfSave': { CF.name = ($('#chName').value || '').trim(); if (!CF.name) return toast('할 일 이름을 적어 주세요');
      const once = CF.type === '비정기', cy = CYCLES.find(x => x[0] === CF.cycle) || CYCLES[0];
      await DB.put('chores', uid(), { name: CF.name, who: CF.who, ...(once ? { once: true } : { every: cy[2] }), start: today, created: today });
      const n = CF.name; CF.name = ''; lastHtml = ''; render(); return toast(`🧹 「${n}」 등록 — ${once ? '비정기' : cy[1]}`); }
    case 'chQuick': { const v = ($('#choreQuick').value || '').trim(); if (!v) return;
      await DB.put('chores', uid(), { name: v, who: isTab() ? 'any' : (ME || 'any'), once: true, created: today, start: today });
      return toast(`🧹 「${v}」 넣었습니다 — 하면 체크`); }
    case 'chNew': go('chore'); setTimeout(() => $('#chName') && $('#chName').focus(), 50); return;
    case 'chEdit': return openSheet('ch', D.chores[id]);
    case 'chCycle': F.every = (CYCLES.find(x => x[0] === b.dataset.v) || CYCLES[0])[2]; return drawSheet();
    case 'chSave': { const name = (F.name || '').trim(); if (!name) return toast('이름을 적어 주세요');
      await DB.put('chores', F.id, { name, who: F.who, ...(F.once ? {} : { every: F.every || CYCLES[0][2] }), lastDone: F.lastDone || '' });
      closeSheet(); return toast('🧹 저장했습니다'); }
    case 'chOff': { const cid = F.id; await DB.put('chores', cid, { off: true }); closeSheet(); return toast('뺐습니다', () => DB.put('chores', cid, { off: false })); }
    /* 설정 */
    case 'role': ROLE = b.dataset.v; ls.set('home-role', ROLE); wake(); lastHtml = ''; return render();
    case 'pushOn': return pushSubscribe();
    case 'pushTest': { const r = await api({ a: 'test', to: isTab() ? 'tab' : ME }); return toast(r.ok ? (r.sent ? '🔔 보냈습니다 — 몇 초 안에 와야 합니다' : '⚠️ 이 기기가 알림에 등록 안 됐습니다. 「알림 받기」 먼저') : '⚠️ ' + (r.error || '실패')); }
    case 'rename': return openSheet('rename', { who: b.dataset.who, name: 이름(b.dataset.who) });
    case 'renameSave': await DB.putRoot({ members: { [F.who]: { ...(D.members[F.who] || {}), name: F.name.trim() } } }); closeSheet(); return;
    case 'demoMe': ME = b.dataset.v; ls.set('home-demo-me', ME); ROLE = 'phone'; ls.set('home-role', ROLE); lastHtml = ''; return render();
    case 'demoReset': localStorage.removeItem('home-demo-v1'); return location.reload();
    case 'logout': return FB.A.signOut(FB.auth).then(() => location.reload());
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.cf) { CF[e.target.dataset.cf] = e.target.value; return; }
  const k = e.target.dataset.in; if (!k) return;
  setF(k, e.target.value);
  if (k === 'date' && sheetKind === 'ev') return drawSheet();
  refreshSaveBtn();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.id === 'chName') { e.preventDefault(); $('[data-act="cfSave"]').click(); return; }
  });

/* ═════════════ 🔔 알림 받기 ═════════════ */
const pushOn = () => ls.get('home-push', false);
async function pushSubscribe() {
  if (DEMO) return toast('미리보기에서는 알림을 안 켭니다');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('⚠️ 알림이 막혀 있습니다. 브라우저 설정에서 허용해 주세요');
    const reg = await navigator.serviceWorker.register('/home/sw.js', { scope: '/home/' });
    await navigator.serviceWorker.ready;
    const { key } = await (await fetch(API + '?a=vapid')).json();
    const raw = atob(key.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(key.length / 4) * 4, '='));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0)) });
    const s = JSON.stringify(sub), h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sub.endpoint)))].slice(0, 12).map(x => x.toString(16).padStart(2, '0')).join('');
    await DB.put('subs', h, { who: isTab() ? 'tab' : ME, sub: s, ua: navigator.userAgent.slice(0, 120), at: Date.now(), off: false });
    ls.set('home-push', true); render(); toast('🔔 알림을 켰습니다');
  } catch (e) { toast('⚠️ 알림 켜기 실패: ' + e.message); }
}

/* ═════════════ 🖥 거실 탭: 화면 켜짐 · 밤 화면 ═════════════ */
async function wake() {
  if (!isTab() || !('wakeLock' in navigator)) { wakeOn = false; return; }
  try { if (!wakeLock || wakeLock.released) { wakeLock = await navigator.wakeLock.request('screen'); wakeOn = true; wakeLock.addEventListener('release', () => { wakeOn = false; }); } } catch (e) { wakeOn = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); render(); } });
let nightSnooze = 0;
function night() {
  const k = C.kst(), on = isTab() && k.min < 7 * 60 && Date.now() - nightSnooze > 10 * 60e3;
  $('#night').classList.toggle('show', on);
  if (!on) return;
  $('#nightTm').textContent = k.time; $('#nightDt').textContent = C.label(k.date);
  const ev = C.eventsOn(Object.values(D.events), k.date)[0];
  $('#nightNext').textContent = ev ? `오늘 ${ev.time || '종일'} ${ev.title}` : '';
}

/* ═════════════ 시작 ═════════════ */
let lastMin = '';
setInterval(() => { const k = C.kst(); if (k.time !== lastMin) { lastMin = k.time; render(); night(); } }, 5000);
(async () => {
  try {
    if (DEMO) { DB = demoDB(); layout(); render(); }
    else await liveDB();
    wake(); night();
    if (!DEMO && 'serviceWorker' in navigator && pushOn()) navigator.serviceWorker.register('/home/sw.js', { scope: '/home/' }).catch(() => {});
  } catch (e) {
    $('#app').innerHTML = `<div class="gate"><h1>⚠️ 못 열었습니다</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">다시</button></div>`;
  }
})();
</script>
