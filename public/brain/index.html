/* 📋 일반 대화방 ↔ 앱 (26-10-15) — 사장님 「코드 말고 그냥 일반 대화방에서 해도 됨? (코드가 토큰을 더 소비할 것 같아서)」
   일반 대화방은 여기에 직접 못 씀 → 대화 끝 「정리해줘」 → 정해진 꼴을 복사해 붙여넣기 · 다음 대화엔 「지금 계획 복사」
   꼴:  # 비전 / # 계획 · ## 이름 [상태] · 왜: · - [ ] 단계 / # 돌아보기 · - 날짜 · 글 / # 기록 · - 💭 고민 · - 📝 결정 · - 💡 아이디어 */
function 계획읽기(text) {
  const out = { vision: '', plans: [], reviews: [], notes: [], ideas: [] }; let sec = '', cur = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim(); if (!line || line.startsWith('<!--') || line.startsWith('```')) continue;
    if (/^#\s/.test(line)) { sec = line.replace(/^#\s*/, ''); cur = null; continue; }
    if (/^##\s/.test(line) && sec.includes('계획')) { const m = line.match(/^##\s+(.*?)\s*(?:\[(.+?)\])?$/); cur = { title: m[1], status: m[2] || '', why: '', steps: [] }; out.plans.push(cur); continue; }
    if (sec.includes('비전')) out.vision = (out.vision + ' ' + line.replace(/^[-*]\s*/, '')).trim();
    else if (sec.includes('계획') && cur) { const m = line.match(/^[-*]\s*\[( |x|X)\]\s*(.+)/); if (m) cur.steps.push({ t: m[2].trim(), d: m[1].toLowerCase() === 'x' }); else if (/^왜\s*:/.test(line)) cur.why = line.replace(/^왜\s*:\s*/, ''); }
    else if (sec.includes('돌아보기')) { const m = line.match(/^[-*]\s*(\d{4}-\d{2}-\d{2})\s*[·:\-]?\s*(.+)/); if (m) out.reviews.push({ date: m[1], text: m[2].trim() }); }
    else if (sec.includes('생각해')) { const m = line.match(/^[-*]\s*(.+)/); if (m) out.ideas.push(m[1].trim()); }
    else if (sec.includes('기록')) { const m = line.match(/^[-*]\s*(💭|📚|🌱)\s*(.+)/); if (m) out.notes.push({ kind: { '💭': 'worry', '📚': 'study', '🌱': 'feel' }[m[1]], text: m[2].trim() }); }
  }
  return out;
}
function 계획글() {
  const P = D.plans.main || {}; let t = `# 비전\n${P.vision || ''}\n\n# 계획\n`;
  (P.plans || []).forEach(pl => { t += `## ${pl.title}${pl.status ? ` [${pl.status}]` : ''}\n${pl.why ? `왜: ${pl.why}\n` : ''}${(pl.steps || []).map(x => `- [${x.d ? 'x' : ' '}] ${x.t}`).join('\n')}\n\n`; });
  t += `# 생각해 볼 것\n${(P.ideas || []).map(x => `- ${x}`).join('\n')}\n\n`;
  t += `# 돌아보기\n${(P.reviews || []).map(r => `- ${r.date} · ${r.text}`).join('\n')}\n`;
  return t;
}

    case 'addTodo': { const t = prompt('할 일 한 줄'); if (!t) return; const p = D.items[b.dataset.pid]; await DB.put('items', p.id, { checks: [...(p.checks || []), { id: String(Date.now()), t, d: false }] }); return toast('넣었습니다'); }
    case 'app': appSel = (appSel === b.dataset.a && cur === 'apps') ? '' : b.dataset.a; 완료보기 = false; if (cur !== 'apps') { cur = 'apps'; document.querySelectorAll('#nav button').forEach(x => x.setAttribute('aria-pressed', x.dataset.s === 'apps')); } return render();
    case 'issueF': issueF = b.dataset.f; return render();
    case 'newIssue': return issueSheet(null);
    case 'issue': return issueSheet(D.issues[id]);
    case 'iApp': { if ($('#iT')) { F.text = $('#iT').value; F.app = b.dataset.k; return issueSheet(null, true); } appSel = b.dataset.k; const t = $('#qT').value; quickSheet(); $('#qT').value = t; return; }
    case 'iSt': F.text = $('#iT').value; F.status = b.dataset.k; return issueSheet(null, true);
    case 'saveIssue': { F.text = $('#iT').value.trim(); if (!F.text) return toast('한 줄 적어 주세요'); const v = { app: F.app, text: F.text, status: F.status || 'new', photo: F.photo || '' };
      if (F.id) await DB.put('issues', F.id, v); else await DB.add('issues', { ...v, at: Date.now() }); appSel = F.app; closeSheet(); return toast('📱 적었습니다'); }
    case 'offIssue': await DB.put('issues', F.id, { off: true }); closeSheet(); return toast('뺐습니다');
    case 'okIssue': await DB.put('issues', id, { status: 'done', doneAt: Date.now() }); return toast('✅ 확인 끝');
    case 'reopen': await DB.put('issues', id, { status: 'new', reopenAt: Date.now() }); return toast('🔴 다시 문제 발생으로');
    case 'doneToggle': 완료보기 = !완료보기; return render();
    case 'acc': { const k2 = b.dataset.pid, box = b.closest('.acc'); box.classList.toggle('open'); box.classList.contains('open') ? 열린.add(k2) : 열린.delete(k2); try { localStorage.setItem('brain-open', JSON.stringify([...열린])); } catch (_) {} return; }
    case 'topic': { const t = D.topics[id]; return openSheet(`<h3>${esc(t.title)}</h3><p class="note" style="margin:0 0 6px">${t.kind === '기록' ? '💭 기록' : '🎯 계획'} · 마지막 정리 ${esc(t.updated || '')}</p>${주제보기(t.md)}<button class="big sec" data-act="x" onclick="document.getElementById('ov').classList.remove('show')">닫기</button>`); }
    case 'planSpare': 예비 = !예비; return render();
    case 'planCopy': { const t = 계획글(); try { await navigator.clipboard.writeText(t); toast('📋 복사했습니다 — 대화방에 붙여넣고 이어서 말씀하세요'); } catch (_) { openSheet(`<h3>📋 지금 계획</h3><textarea class="fld" rows="14">${esc(t)}</textarea><p class="note">길게 눌러 전체 선택 → 복사</p>`); } return; }
    case 'planPaste': return openSheet(`<h3>📥 대화 정리 붙여넣기</h3><p class="note" style="margin-top:0">대화방 끝에 「정리해줘」 하면 나오는 글을 통째로 붙여넣으세요. 계획은 새 글로 바뀌고(체크는 유지), 돌아보기·기록은 더해집니다.</p><textarea class="fld" id="pp" rows="12" placeholder="# 비전 …"></textarea><button class="big" data-act="planPasteGo">미리 보기</button>`);
    case 'planPasteGo': { const R = 계획읽기($('#pp').value); if (!R.vision && !R.plans.length && !R.reviews.length && !R.notes.length) return toast('정리 꼴을 못 읽었습니다 — 「# 비전」으로 시작하는 글인지 봐 주세요');
      F = R; return openSheet(`<h3>이렇게 넣을까요?</h3><div class="card">${R.vision ? `<div class="row"><div class="m">🎯 비전<small>${esc(R.vision)}</small></div></div>` : ''}${R.plans.map(p => `<div class="row"><div class="m">${esc(p.title)}<small>${p.status ? esc(p.status) + ' · ' : ''}단계 ${p.steps.length}</small></div></div>`).join('')}${R.reviews.length ? `<div class="row"><div class="m">돌아보기 +${R.reviews.length}</div></div>` : ''}${R.notes.length ? `<div class="row"><div class="m">💭 기록 +${R.notes.length}<small>${R.notes.map(n => esc(n.text)).join(' · ').slice(0, 120)}</small></div></div>` : ''}</div><button class="big" data-act="planPasteSave">넣기</button><button class="big sec" data-act="planPaste">다시 붙여넣기</button>`); }
    case 'planPasteSave': { const R = F, P = D.plans.main || {}, 체크 = new Set((P.plans || []).flatMap(p => (p.steps || []).filter(x => x.d).map(x => x.t)));
      R.plans.forEach(p => p.steps.forEach(x => { x.d = x.d || 체크.has(x.t); }));
      const 옛돌 = P.reviews || [], 새돌 = R.reviews.filter(r => !옛돌.some(o => o.date === r.date && o.text === r.text));
      const v = { updated: today, reviews: [...옛돌, ...새돌] }; if (R.vision) v.vision = R.vision; if (R.plans.length) v.plans = R.plans; if (R.ideas.length) v.ideas = R.ideas;
      await DB.put('plans', 'main', v); for (const n of R.notes) await DB.add('notes', { ...n, at: Date.now(), solved: false, from: 'chat' });
      closeSheet(); return toast(`🎯 넣었습니다${R.notes.length ? ` · 💭 기록 ${R.notes.length}` : ''}`); }
    case 'planStep': { const P = D.plans.main, pl = JSON.parse(JSON.stringify(P.plans)); const x = pl[+b.dataset.pi].steps[+b.dataset.si]; x.d = !x.d; await DB.put('plans', 'main', { plans: pl, checkedAt: Date.now() }); return; }
    case 'noIssue': await DB.put('issues', id, { status: 'new', back: '다시 생김' }); return toast('🔴 다시 문제 발생으로');
    case 'noteF': noteF = b.dataset.f; return render();
    case 'note': return noteSheet(D.notes[id]);
    case 'saveNote': { const v = { text: $('#nT').value }; if ($('#nH')) v.how = $('#nH').value; await DB.put('notes', F.id, v); closeSheet(); return toast('저장했습니다'); }
    case 'solveNote': { await DB.put('notes', F.id, { text: $('#nT').value, how: ($('#nH') || {}).value || '', solved: true, solvedAt: Date.now() }); closeSheet(); return toast('✅ 넘긴 고민으로'); }
    case 'offNote': await DB.put('notes', F.id, { off: true }); closeSheet(); return toast('뺐습니다');
    case 'qk': { const t = ($('#qT') || {}).value || ''; QK = b.dataset.k; if (QK === 'event') { closeSheet(); evSheet(null); setTimeout(() => { if ($('#evT')) $('#evT').value = t; }, 30); return; } quickSheet(); $('#qT').value = t; return; }
    case 'qSave': { const t = $('#qT').value.trim(); if (!t) return toast('한 줄 적어 주세요');
      if (QK === 'issue') await DB.add('issues', { app: appSel || 'staff', text: t, status: 'new', at: Date.now() });
      else if (QK === 'todo') { const p = D.items[$('#qP').value]; await DB.put('items', p.id, { checks: [...(p.checks || []), { id: String(Date.now()), t, d: false }] }); }
      else await DB.add('notes', { kind: QK, text: t, at: Date.now(), solved: false, from: 'phone' });
      closeSheet(); return toast({ worry: '💭 고민을 남겼습니다', study: '📚 공부를 남겼습니다', feel: '🌱 남겼습니다', todo: '✅ 할 일에 넣었습니다', issue: '📱 앱 판에 넣었습니다' }[QK]); }
  }
});

if (DEMO) { window.__D = D; window.__render = render; }   // 미리보기(내 맥)에서만 — 시험용
if (DEMO) demo(); else live().catch(e => { $('#app').innerHTML = `<div class="empty">못 열었습니다<br><small>${esc(e.message)}</small></div>`; });
</script>
