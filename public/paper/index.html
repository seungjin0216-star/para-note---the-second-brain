<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icon-180.png">
<title>펜슬 연습장 — 주소가 바뀌었습니다</title>
<!-- 26-10-31 연습장은 store-app/paper/ 로 옮김 (Netlify 크레딧 바닥 → 배포 멈춤). 정본은 거기 하나.
     일부러 자동으로 넘기지 않음: 이 주소에서 쓴 장은 이 주소 안에만 있어서, 넘기면 볼 길이 사라짐 -->
<style>
  :root{--ink:#26231f;--mute:#8a847a;--accent:#c2410c}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#efebe3;color:var(--ink);
    font:17px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding:24px;box-sizing:border-box}
  main{max-width:460px;background:#fffdf8;border-radius:18px;padding:28px;box-shadow:0 4px 20px #0001}
  h1{font-size:22px;margin:0 0 12px}
  a{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:14px;margin:18px 0}
  p{margin:8px 0}
  small{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>✏️ 연습장 주소가 바뀌었습니다</h1>
  <p>새 주소에서 여시고, 사파리 공유 단추 → <b>「홈 화면에 추가」</b>를 다시 해주세요.</p>
  <a href="https://seungjin0216-star.github.io/store-app/paper/">새 연습장 열기</a>
  <small>이 주소에서 쓴 장은 새 주소로 넘어가지 않습니다.</small>
</main>
</body>
</html>
