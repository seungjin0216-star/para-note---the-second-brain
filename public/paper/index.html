<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="연습장">
<meta name="theme-color" content="#efebe3">
<link rel="apple-touch-icon" href="icon-180.png">
<title>펜슬 연습장</title>
<style>
:root{
  --bar:#efebe3; --ink:#26231f; --mute:#8a847a; --line:#d9d3c7; --on:#26231f; --onT:#fff;
  --desk:#cfc9bd; --paper:#fffdf8; --accent:#c2410c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);
  font:15px/1.3 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.grp{display:flex;align-items:center;gap:4px}
.grow{flex:1;min-width:330px}
button{font:inherit;color:inherit;background:none;border:0;border-radius:10px;min-width:40px;height:40px;padding:0 8px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
button:active{background:#0001}
button:disabled{opacity:.3}
button.on{background:var(--on);color:var(--onT)}
button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:20px;height:20px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1.5px #0002}
button.on .dot{box-shadow:0 0 0 2px var(--bar),0 0 0 4px var(--onT)}
.sz i{display:block;border-radius:50%;background:currentColor}
#qno{width:76px;flex:none;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font:inherit;color:inherit;
  -webkit-user-select:text;user-select:text}
.chip{border:1px solid var(--line);background:#fff;font-weight:600;max-width:260px;white-space:nowrap}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chap{flex:0 1 auto;min-width:0}
#wrong{color:var(--accent);border-color:#e9b9a3;flex:none}
#wrong.on{background:var(--accent);border-color:var(--accent);color:#fff}
#selbar{position:absolute;display:none;gap:4px;background:#26231f;border-radius:12px;padding:4px;z-index:5;box-shadow:0 4px 16px #0003}
#selbar.show{display:flex}
#selbar button{color:#fff;height:36px;font-size:14px;font-weight:600}
.sheet{position:fixed;inset:0;z-index:15;background:#0004;display:none;align-items:flex-start;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 60px)}
.sheet.show{display:flex}
.sheetIn{background:#fff;border-radius:16px;width:min(560px,94vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px #0004}
.sheetIn header{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:#0000000d;border-radius:12px;padding:3px}
.tabs button{height:36px;font-weight:600;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.rows{overflow-y:auto;touch-action:pan-y;padding:6px}
.rows button{width:100%;justify-content:flex-start;text-align:left;height:auto;min-height:46px;padding:8px 12px;gap:10px}
.rows button.on{background:#fbe9e0;color:var(--ink)}
.rows .n{color:var(--mute);font-variant-numeric:tabular-nums;min-width:52px}
.rows .t{flex:1}
.rows .c{color:var(--mute);font-size:13px}
.rows .w{background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:13px;font-weight:700}
.empty{color:var(--mute);padding:24px;text-align:center;grid-column:1/-1}
#tm{font-variant-numeric:tabular-nums;font-weight:600;min-width:86px;border:1px solid var(--line);background:#fff}
#tm.run{background:var(--accent);border-color:var(--accent);color:#fff}
#pn{min-width:54px;text-align:center;font-variant-numeric:tabular-nums;color:var(--mute)}
#add{border:1px solid var(--line);background:#fff;font-weight:600}
#paper{position:relative;flex:1;overflow:hidden;touch-action:none}
#paper canvas{position:absolute;left:0;top:0}
#sb{position:absolute;right:3px;width:5px;border-radius:3px;background:#0003;pointer-events:none;transition:opacity .4s;opacity:0}
#menu{position:fixed;z-index:20;background:#fff;border-radius:14px;box-shadow:0 8px 30px #0003;padding:8px;min-width:230px;display:none}
#menu.show{display:block}
#menu h4{margin:6px 8px;font-size:12px;color:var(--mute);font-weight:600}
#menu button{width:100%;justify-content:flex-start;height:44px}
#menu .row{display:flex;gap:4px}
#menu .row button{justify-content:center}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#list{position:fixed;inset:0;z-index:10;background:#f6f3ed;display:none;flex-direction:column}
#list.show{display:flex}
#list>header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
#lsub{display:flex;align-items:center;gap:8px;padding:10px 16px 0;flex-wrap:wrap}
#lsub:empty{display:none}
#lsub h3{margin:0 0 0 4px;font-size:17px}
#grid .rows{grid-column:1/-1;padding:0;background:#fff;border-radius:12px}
#grid{flex:1;overflow-y:auto;touch-action:pan-y;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;align-content:start}
.card{background:none;height:auto;padding:0;flex-direction:column;align-items:stretch;border-radius:10px;text-align:left}
.card canvas{width:100%;aspect-ratio:1000/1414;background:var(--paper);border-radius:8px;box-shadow:0 1px 4px #0002}
.card.cur canvas{outline:3px solid var(--accent)}
.card b{display:block;margin-top:6px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--mute);font-size:12px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#26231fe6;color:#fff;padding:10px 16px;border-radius:12px;
  font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
@media (max-width:860px){ .grow{order:9;flex-basis:100%} }
</style>
</head>
<body>
<header id="bar">
  <div class="grp">
    <button id="bList" aria-label="모든 장"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
  </div>
  <div class="grp grow">
    <button id="chap" class="chip"><span>과목·장 고르기 ▾</span></button>
    <input id="qno" placeholder="문제 번호" autocomplete="off">
    <button id="wrong" class="chip">오답노트로</button>
  </div>
  <div class="grp" id="tools">
    <button data-tool="pen" data-color="#26231f" aria-label="검정 펜"><i class="dot" style="background:#26231f"></i></button>
    <button data-tool="pen" data-color="#1f4fd1" aria-label="파랑 펜"><i class="dot" style="background:#1f4fd1"></i></button>
    <button data-tool="pen" data-color="#d22f27" aria-label="빨강 펜"><i class="dot" style="background:#d22f27"></i></button>
    <button data-tool="hl" data-color="#ffd400" aria-label="형광펜"><svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h8" stroke="#e6b800" stroke-width="3"/></svg></button>
    <button data-tool="er" aria-label="지우개"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/><path d="M9 11l5 5"/></svg></button>
    <button data-tool="lasso" aria-label="올가미"><svg viewBox="0 0 24 24"><path d="M7 16.5C4.6 15.3 3 13.4 3 11.2 3 7.2 7 4 12 4s9 3.2 9 7.2-4 7.2-9 7.2c-1 0-2-.1-2.9-.4" stroke-dasharray="2.6 2.6"/><path d="M9.5 16.5c0 1.5-1 2.8-2.5 3.5"/><circle cx="8.3" cy="16.4" r="1.4"/></svg></button>
  </div>
  <div class="grp" id="sizes">
    <button class="sz" data-size="0" aria-label="가늘게"><i style="width:4px;height:4px"></i></button>
    <button class="sz" data-size="1" aria-label="보통"><i style="width:7px;height:7px"></i></button>
    <button class="sz" data-size="2" aria-label="굵게"><i style="width:11px;height:11px"></i></button>
  </div>
  <div class="grp">
    <button id="undo" aria-label="되돌리기"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="redo" aria-label="다시하기"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>
  <div class="grp">
    <button id="tm" aria-label="이 장 시간 재기">▶ 00:00</button>
  </div>
  <div class="grp">
    <button id="prev" aria-label="앞 장"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="pn">1 / 1</span>
    <button id="next" aria-label="뒷 장"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="add">＋ 새 장</button>
    <button id="more" aria-label="더 보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>
</header>
<main id="paper">
  <canvas id="cBg"></canvas><canvas id="cInk"></canvas><canvas id="cLive"></canvas>
  <div id="sb"></div>
  <div id="selbar"><button id="selDup">복제</button><button id="selDel">지우기</button></div>
</main>

<div id="pick" class="sheet">
  <div class="sheetIn">
    <header><div class="tabs" id="pickTabs"></div><span style="flex:1"></span><button id="pickClose">닫기</button></header>
    <div class="rows" id="pickList"></div>
  </div>
</div>

<div id="menu">
  <h4>종이</h4>
  <div class="row">
    <button data-bg="plain">무지</button><button data-bg="line">줄</button><button data-bg="grid">모눈</button>
  </div>
  <hr>
  <h4>시간</h4>
  <button id="tmReset">이 장 시간 0으로</button>
  <hr>
  <button id="share">이 장을 사진으로 내보내기</button>
  <button id="clear">이 장 비우기 (되돌리기 됨)</button>
</div>

<section id="list">
  <header>
    <div class="tabs" id="lTabs"><button data-view="all">모든 장</button><button data-view="wrong">오답노트</button></div>
    <span style="flex:1"></span>
    <button id="add2" class="chip">＋ 새 장</button><button id="closeList">닫기</button>
  </header>
  <div id="lsub"></div>
  <div id="grid"></div>
</section>
<div id="toast"></div>

<script>

<script>
'use strict';
// 종이 한 장 = 가로 1000 × 세로 1414 (A4 비율). 좌표는 이 단위로 저장 → 화면을 돌려도 글씨 위치가 그대로
const LW = 1000, PH = 1414;
const SIZES = { pen:[2.2, 3.2, 4.8], hl:[14, 20, 28] };
const ER_R = 10;
const $ = s => document.querySelector(s);
const paper = $('#paper'), cBg = $('#cBg'), cInk = $('#cInk'), cLive = $('#cLive');
const xBg = cBg.getContext('2d'), xInk = cInk.getContext('2d'), xLive = cLive.getContext('2d');

/* ── 과목 · 목차 ─────────────────────────────
   재무회계 = 사장님이 보내주신 연습서 목차 사진 (IMG_5967 · 26-10-31 · 총 617문제 — 장별 합이 정확히 617)
   ⚠️ 장 순서를 바꾸거나 중간에 끼우면 옛 오답이 다른 장을 가리킴 (장 번호 i 로 저장) → 끝에만 더할 것
   원가회계 · 세법 목차는 「추후에 정리」 (사장님) — 비워 둠 */
const BOOKS = {
  '재무회계': [
    ['01', '재무회계 일반', 34], ['02', '재고자산', 34], ['03', '유형·무형자산·투자부동산', 64], ['04', '차입원가', 11],
    ['05', '부채·종업원급여', 41], ['06', '자본', 21], ['07', '금융자산', 36], ['08', '복합금융상품', 16],
    ['09', '주식기준보상거래', 24], ['10', '고객과의 계약에서 생기는 수익', 51], ['11', '리스', 24], ['12', '법인세', 14],
    ['13', '회계변경과 오류', 22], ['14', '주당이익', 17], ['15', '현금흐름표', 25], ['16', '사업결합', 24],
    ['17', '연결회계', 46], ['18', '지분법', 15], ['19', '환율변동효과', 17], ['20', '파생금융상품', 18],
    ['21', '재무회계 기타', 13], ['22', '추가문제', 50], ['부록', '재무제표 작성', 0]
  ],
  '원가회계': [],
  '세법': []
};
const SUBJ = Object.keys(BOOKS);
const short = s => s === '세법' ? '세법' : s.slice(0, 2);
function chOf(p) { const b = BOOKS[p.subj]; return b && p.ch != null ? b[p.ch] : null; }
function chName(c) { return c[0] === '부록' ? '부록 ' + c[1] : '제' + c[0] + '장 ' + c[1]; }
function label(p) {
  const c = chOf(p), a = [];
  if (p.subj) a.push(c ? short(p.subj) + ' ' + (c[0] === '부록' ? '부록' : +c[0] + '장') : p.subj);
  if (p.q) a.push(/\d$/.test(p.q) ? p.q + '번' : p.q);

$('#undo').onclick = undo; $('#redo').onclick = redo;
document.addEventListener('keydown', e => {
  if (e.target.id === 'qno') return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
});

/* ── 도구 ─────────────────────────────── */
function syncBtns() {
  document.querySelectorAll('#tools button').forEach(b => {
    const t = b.dataset.tool;
    b.classList.toggle('on', t === st.tool && (t !== 'pen' || b.dataset.color === st.color));
  });
  document.querySelectorAll('#sizes button').forEach(b => b.classList.toggle('on', +b.dataset.size === st.size));
  $('#sizes').style.visibility = st.tool === 'er' || st.tool === 'lasso' ? 'hidden' : '';
  const h = H_(); $('#undo').disabled = !h.u.length; $('#redo').disabled = !h.r.length;
  $('#pn').textContent = (cur + 1) + ' / ' + pages.length;
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === pages.length - 1;
  document.querySelectorAll('#menu [data-bg]').forEach(b => b.classList.toggle('on', b.dataset.bg === P().bg));
  syncQ();
}
function syncQ() {
  const p = P(), c = chOf(p);
  $('#chap span').textContent = p.subj ? short(p.subj) + (c ? ' ' + (c[0] === '부록' ? '부록 ' : +c[0] + '장 ') + c[1] : '') + ' ▾' : '과목·장 ▾';
  if (document.activeElement !== $('#qno')) $('#qno').value = p.q || '';
  const w = $('#wrong'); w.classList.toggle('on', !!p.wrong); w.textContent = p.wrong ? '✓ 오답노트' : '오답노트로';
}
document.querySelectorAll('#tools button').forEach(b => b.onclick = () => {
  st.tool = b.dataset.tool; if (st.tool === 'pen') st.color = b.dataset.color;
  if (st.tool !== 'lasso') clearSel();
  pref('tool', st.tool); pref('color', st.color); syncBtns();
});
document.querySelectorAll('#sizes button').forEach(b => b.onclick = () => { st.size = +b.dataset.size; pref('size', st.size); syncBtns(); });

/* ── 장 넘기기 ─────────────────────────────── */
function go(i) {
  if (i < 0 || i >= pages.length) return;
  pauseTimer(); sel = null; lasso = null;
  cur = i; offY = 0; pref('page', P().id);
  syncBtns(); paintAll(); tick();
}
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
function addPage() { const p = newPage(P()); pages.push(p); touch(p); go(pages.length - 1); toast('새 장'); }
$('#add').onclick = addPage;
$('#qno').addEventListener('input', e => { P().q = e.target.value.trim(); touch(P()); });
$('#qno').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

/* ── 과목·장 고르기 ─────────────────────────────── */
let pickSubj = '재무회계';
function openPick() { pickSubj = P().subj || pickSubj; renderPick(); $('#pick').classList.add('show'); }
function closePick() { $('#pick').classList.remove('show'); }
function renderPick() {
  const p = P();
  $('#pickTabs').innerHTML = '';
  SUBJ.forEach(s => {
    const b = document.createElement('button'); b.textContent = s; b.classList.toggle('on', s === pickSubj);
    b.onclick = () => { pickSubj = s; renderPick(); };
    $('#pickTabs').append(b);
  });
  const L = $('#pickList'); L.innerHTML = '';
  const row = (n, t, c, on, fn) => {
    const b = document.createElement('button'); b.classList.toggle('on', on);
    b.innerHTML = '<span class="n"></span><span class="t"></span><span class="c"></span>';
    b.querySelector('.n').textContent = n; b.querySelector('.t').textContent = t; b.querySelector('.c').textContent = c;
    b.onclick = fn; L.append(b);
  };
  const set = (subj, ch) => { p.subj = subj; p.ch = ch; touch(p); syncQ(); closePick(); };
  const book = BOOKS[pickSubj];
  if (!book.length) row('', pickSubj + ' — 목차는 나중에 넣습니다. 과목만 정하기', '', p.subj === pickSubj, () => set(pickSubj, null));
  book.forEach((c, i) => row(c[0] === '부록' ? '부록' : '제' + c[0] + '장', c[1], c[2] ? c[2] + '문제' : '',
    p.subj === pickSubj && p.ch === i, () => set(pickSubj, i)));
  if (p.subj) row('', '과목·장 비우기', '', false, () => set('', null));
}
$('#chap').onclick = openPick;
$('#pickClose').onclick = closePick;
$('#pick').addEventListener('click', e => { if (e.target.id === 'pick') closePick(); });

/* ── 오답노트 ─────────────────────────────
   같은 장을 「오답」으로 표시만 함 (복사하지 않음 → 풀이와 오답노트가 어긋나지 않음)
   모아 보기는 모든 장 → 오답노트 탭에서 과목 → 목차 → 문제 번호 순 */
$('#wrong').onclick = () => {
  const p = P(); p.wrong = !p.wrong; p.wrongAt = p.wrong ? Date.now() : 0; touch(p); syncQ();
  if (!p.wrong) return toast('오답노트에서 뺐습니다');
  if (!p.subj || (BOOKS[p.subj].length && p.ch == null)) { toast('어느 장 문제인지 골라주세요'); openPick(); }
  else if (!p.q) { toast('문제 번호도 적어주세요'); $('#qno').focus(); }
  else toast('오답노트에 넣었습니다 · ' + label(p));
};

/* ── 시간 (장마다) ─────────────────────────────── */
function secOf(p) { return p.sec + (p.run ? Math.floor((Date.now() - p.run) / 1000) : 0); }
function fmt(s) { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; const pad = n => String(n).padStart(2, '0'); return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(x); }
function pauseTimer() { const p = P(); if (p && p.run) { p.sec = secOf(p); p.run = 0; touch(p); } }
function tick() { const p = P(); if (!p) return; const b = $('#tm'); b.textContent = (p.run ? '⏸ ' : '▶ ') + fmt(secOf(p)); b.classList.toggle('run', !!p.run); }
$('#tm').onclick = () => { const p = P(); if (p.run) pauseTimer(); else { p.run = Date.now(); touch(p); } tick(); };
setInterval(tick, 1000);

/* ── 더 보기 메뉴 ─────────────────────────────── */
function closeMenu() { $('#menu').classList.remove('show'); }
$('#more').onclick = e => {
  const m = $('#menu'); if (m.classList.contains('show')) return closeMenu();
  const r = e.currentTarget.getBoundingClientRect();
  m.classList.add('show');
  m.style.top = (r.bottom + 6) + 'px'; m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + 'px';
  syncBtns();
};
document.querySelectorAll('#menu [data-bg]').forEach(b => b.onclick = () => { P().bg = b.dataset.bg; touch(P()); paintAll(); syncBtns(); });
$('#tmReset').onclick = () => { if (!confirm('이 장의 시간을 0으로 할까요?')) return; const p = P(); p.sec = 0; p.run = 0; touch(p); tick(); closeMenu(); };
$('#clear').onclick = () => {
  const p = P(); if (!p.strokes.length) return closeMenu();
  sel = null; push({ a:'clear', s: p.strokes.slice() }); p.strokes = [];
  paintAll(); closeMenu(); toast('비웠습니다 · 되돌리기로 살릴 수 있어요');
};
$('#share').onclick = async () => {
  closeMenu();
  const p = P(), k = 2, c = document.createElement('canvas'); c.width = LW * k; c.height = PH * k;
  const x = c.getContext('2d'); x.setTransform(k, 0, 0, k, 0, 0); paintBg(x, p.bg, 0, PH); paintStrokes(x, p.strokes);
  const head = label(p);
  x.fillStyle = '#8a847a'; x.font = '22px -apple-system, sans-serif'; x.fillText(head + ' · ' + fmt(secOf(p)), 84, 50);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const name = head + '.png';
  const file = new File([blob], name, { type:'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file] }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
document.addEventListener('pointerdown', e => { if (!e.target.closest('#menu,#more')) closeMenu(); });

/* ── 모든 장 · 오답노트 ─────────────────────────────── */
const lv = { view:'all', subj:'재무회계', ch:undefined };   // ch: undefined = 목차, null = 장 미정, 숫자 = 그 장
function card(p) {
  const i = pages.indexOf(p);
  const b = document.createElement('button'); b.className = 'card' + (i === cur ? ' cur' : '');
  const c = document.createElement('canvas'); c.width = 250; c.height = 354;
  const x = c.getContext('2d'); x.setTransform(.25, 0, 0, .25, 0, 0); paintBg(x, p.bg, 0, PH); paintStrokes(x, p.strokes);
  const d = new Date(p.created);
  b.append(c);
  b.insertAdjacentHTML('beforeend', '<b></b><small></small>');
  b.querySelector('b').textContent = (p.wrong ? '❌ ' : '') + label(p);
  b.querySelector('small').textContent = (i + 1) + '번째 장 · ' + (d.getMonth() + 1) + '/' + d.getDate() + ' · ' + fmt(secOf(p));
  b.onclick = () => { $('#list').classList.remove('show'); go(i); };
  return b;
}
function renderList() {
  const g = $('#grid'), sub = $('#lsub'); g.innerHTML = ''; sub.innerHTML = '';
  document.querySelectorAll('#lTabs button').forEach(b => b.classList.toggle('on', b.dataset.view === lv.view));
  if (lv.view === 'all') { pages.forEach(p => g.append(card(p))); return; }

  const wrong = pages.filter(p => p.wrong);
  const tabs = document.createElement('div'); tabs.className = 'tabs';
  SUBJ.forEach(s => {
    const b = document.createElement('button'), n = wrong.filter(p => p.subj === s).length;
    b.textContent = s + (n ? ' ' + n : ''); b.classList.toggle('on', s === lv.subj);
    b.onclick = () => { lv.subj = s; lv.ch = undefined; renderList(); };
    tabs.append(b);
  });
  sub.append(tabs);
  const none = wrong.filter(p => !p.subj);
  if (none.length) {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = '과목 안 정한 것 ' + none.length;
    b.onclick = () => { lv.subj = ''; lv.ch = undefined; renderList(); };
    sub.append(b);
  }
  const inSubj = wrong.filter(p => (p.subj || '') === lv.subj);
  const book = BOOKS[lv.subj] || [];
  const show = list => { if (!list.length) g.insertAdjacentHTML('beforeend', '<div class="empty">아직 없습니다</div>'); list.sort(byQ).forEach(p => g.append(card(p))); };

  if (!book.length) return show(inSubj);           // 목차 없는 과목 · 과목 안 정한 것 → 바로 카드
  if (lv.ch !== undefined) {                        // 한 장 안
    const back = document.createElement('button'); back.className = 'chip'; back.textContent = '‹ 목차';
    back.onclick = () => { lv.ch = undefined; renderList(); };
    const h = document.createElement('h3'); h.textContent = lv.ch === null ? '장 안 정한 것' : chName(book[lv.ch]);
    sub.append(back, h);
    return show(inSubj.filter(p => (p.ch ?? null) === lv.ch));
  }
  const rows = document.createElement('div'); rows.className = 'rows';
  const row = (n, t, cnt, all, ch) => {
    const b = document.createElement('button');
    b.innerHTML = '<span class="n"></span><span class="t"></span><span class="c"></span>' + (cnt ? '<span class="w"></span>' : '');
    b.querySelector('.n').textContent = n; b.querySelector('.t').textContent = t;
    b.querySelector('.c').textContent = all ? all + '문제' : '';
    if (cnt) b.querySelector('.w').textContent = '오답 ' + cnt;
    if (!cnt) b.style.opacity = .55;
    b.onclick = () => { lv.ch = ch; renderList(); };
    rows.append(b);
  };
  book.forEach((c, i) => row(c[0] === '부록' ? '부록' : '제' + c[0] + '장', c[1], inSubj.filter(p => p.ch === i).length, c[2], i));
  const loose = inSubj.filter(p => p.ch == null).length;
  if (loose) row('', '장 안 정한 것', loose, 0, null);
  g.append(rows);
}
function openList(view) {
  pauseTimer(); tick();
  if (view) lv.view = view;
  if (lv.view === 'wrong' && P().subj) lv.subj = P().subj;
  renderList();
  $('#list').classList.add('show');
  $('#grid').querySelector('.cur')?.scrollIntoView({ block:'center' });
}
document.querySelectorAll('#lTabs button').forEach(b => b.onclick = () => { lv.view = b.dataset.view; lv.ch = undefined; renderList(); });
$('#bList').onclick = () => openList();
$('#closeList').onclick = () => $('#list').classList.remove('show');
$('#add2').onclick = () => { $('#list').classList.remove('show'); addPage(); };

/* ── 알림 ─────────────────────────────── */
let toT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toT); toT = setTimeout(() => t.classList.remove('show'), 1800); }

/* ── 시작 ─────────────────────────────── */
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);
new ResizeObserver(resize).observe(paper);

(async () => {
  const ok = await DB.open();
  if (!ok) toast('이 브라우저에서는 저장이 안 됩니다');
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  pages = (await DB.all()).sort((a, b) => a.created - b.created);
  // 26-10-31 전 장은 「문제 번호」 칸 하나(title)뿐 → 그 글을 문제 번호로 옮겨 보여줌 (title 은 그대로 둠)
  pages.forEach(p => { if (p.q === undefined) { p.q = p.title || ''; p.subj = ''; p.ch = null; p.wrong = false; } });
  if (!pages.length) { const p = newPage(); pages.push(p); touch(p); }
  const t = pref('tool'), c = pref('color'), s = pref('size'), last = pref('page');
  if (t) st.tool = t; if (c) st.color = c; if (s !== null && s !== undefined) st.size = +s;
  const i = pages.findIndex(p => p.id === last);
  cur = i >= 0 ? i : pages.length - 1;
  resize(); syncBtns(); tick();
})();
</script>
</body>
</html>
